      }
      const date = this.root.querySelector("#admin-date").value || todayStr();
      if(this.period === "semana") return weekRange(date);
      if(this.period === "mes") return monthRange(date);
      return [date, date];
    },
    prevRange(start, end){
      if(this.period === "semana") return weekRange(addDias(start, -7));
      if(this.period === "mes") return monthRange(addDias(start, -1));
      if(this.period === "periodo"){
        const n = diasEntre(start, end) + 1;
        const pend = addDias(start, -1);
        return [addDias(pend, -(n-1)), pend];
      }
      const d = addDias(start, -1);
      return [d, d];
    },
    cmpLabel(){ return this.period==="dia" ? "dia anterior" : this.period==="semana" ? "semana anterior" : this.period==="mes" ? "mês anterior" : "período anterior de mesmo tamanho"; },
    async buscar(s, e){ return s === e ? getOrdersForDate(s) : getOrdersForRange(s, e); },
    async refresh(){
      if(!this.root || !this.root.querySelector("#admin-range-label")) return;
      const [start, end] = this.getRange();
      const [pstart, pend] = this.prevRange(start, end);
      if(this._busy) return;
      this._busy = true;
      let orders, prev;
      try{ [orders, prev] = await Promise.all([ this.buscar(start, end), this.buscar(pstart, pend) ]); }
      finally{ this._busy = false; }
      this.D = { orders, prev, start, end, pstart, pend, A:aggPedidos(orders), P:aggPedidos(prev) };
      this.root.querySelector("#admin-range-label").textContent =
        (start === end ? "Mostrando o dia "+fmtDataLonga(start) : "Mostrando de "+fmtDataLonga(start)+" até "+fmtDataLonga(end))
        + " · comparando com o " + this.cmpLabel();
      await this.desenhar();
    },
    async desenhar(forcar){
      if(!this.D) return;
      const body = this.root.querySelector("#adm-body");
      if(!body) return;
      const sec = this.sec;
      if((sec === "clientes" || sec === "operacao") && (!this.todos || Date.now()-this.todosT > 60000)){
        if(!this.todos) body.innerHTML = '<div class="empty">Carregando histórico...</div>';
        this.todos = await getTodosPedidos();
        this.todosT = Date.now();
        if(sec === "clientes") this.cad = await getClients();
      }
      if(sec === "produtos" && !this.saboresAll){
        try{ this.saboresAll = await getItems("sabores"); }catch(e){ this.saboresAll = []; }
      }
      if(sec !== this.sec) return; // trocou de aba enquanto carregava
      const fn = this["sec_"+sec];
      const html = fn ? fn.call(this) : "";
      // Atualização automática: só redesenha se algo mudou (evita a tela piscar)
      const assinatura = sec + "|" + html + (sec === "comandas" ? JSON.stringify(this.D.orders.map(o=>[o.id,o.status,o.valor,o.pagamento,o.horarios])) : "");
      if(!forcar && assinatura === this._assinatura) return;
      this._assinatura = assinatura;
      const y = window.scrollY;
      if(this.adminMap){ try{ this.adminMap.remove(); }catch(e){} this.adminMap = null; this.adminMapMarkers = []; }
      body.innerHTML = html;
      if(sec === "comandas") await this.montarComandas();
      if(!forcar) window.scrollTo(0, y);
      if(this.sec === "clientes"){
        body.querySelectorAll(".adm-lim").forEach(b=> b.addEventListener("click", ()=>{ this.sumidoDias = parseInt(b.dataset.d,10); this.desenhar(true); }));
      }
    },

    /* ---------- Resumo ---------- */
    sec_resumo(){
      const { A, P, start, end, orders } = this.D;
      const validos = orders.filter(o=>o.status!=="Cancelada");
      const kpis = `<div class="admin-summary">
        ${kpi("faturamento", fmtMoney(A.fat), delta(A.fat, P.fat))}
        ${kpi("pedidos (sem cancelados)", A.validos, delta(A.validos, P.validos))}
        ${kpi("pizzas vendidas", A.pizzas, delta(A.pizzas, P.pizzas))}
        ${kpi("ticket médio", fmtMoney(A.ticket), delta(A.ticket, P.ticket))}
        ${kpi("pizzas por pedido", fmtNum(A.pizzasPorPedido), delta(A.pizzasPorPedido, P.pizzasPorPedido))}
        ${kpi("bebidas vendidas", A.bebidas, delta(A.bebidas, P.bebidas))}
        ${kpi("cancelados", A.cancelados + (A.total ? ` <small>(${fmtPct(A.cancelados/A.total*100)})</small>` : ""), delta(A.cancelados, P.cancelados, true))}
        ${kpi("tempo médio até a entrega", fmtMinutes(A.avgTotal), delta(A.avgTotal||0, P.avgTotal, true))}
        ${kpi("erros de gestão (+"+limiteTxt()+" parado)", A.erros.length, delta(A.erros.length, P.erros.length, true))}
        ${kpi("entregas em até "+META_ENTREGA_MIN+" min", fmtPct(A.noPrazo), P.noPrazo!==null && A.noPrazo!==null ? delta(A.noPrazo, P.noPrazo) : "")}
      </div>`;
      let grafico;
      if(start === end){
        grafico = painel("Pedidos por hora", this.graficoHoras(validos, o=>1, n=>String(n)), "quantidade de pedidos em cada hora do dia");
      } else {
        const dias = []; for(let d=start; d<=end; d=addDias(d,1)) dias.push(d);
        const porDia = {}; validos.forEach(o=>{ porDia[o.date] = (porDia[o.date]||0) + (Number(o.valor)||0); });
        const itens = dias.map(d=>({ label: DIAS_SEMANA[parseYMD(d).getDay()]+" "+fmtDateBR(d), val: porDia[d]||0 }));
        grafico = painel("Faturamento por dia", vbars(itens, v=>"R$ "+Math.round(v), dias.length<=10), "total vendido em cada dia do período");
      }
      const sab = contaSabores(validos);
      const clientes = somaPorChave(validos, o=> normalizePhone(o.telefone)||o.nome, o=>Number(o.valor)||0);
      const nomeDe = {}; validos.forEach(o=>{ nomeDe[normalizePhone(o.telefone)||o.nome] = o.nome; });
      const horas = somaPorChave(validos, o=> o.horarios.pedido ? new Date(o.horarios.pedido).getHours() : null, o=>1);
      const dest = [];
      if(sab[0]) dest.push(["🍕 Sabor mais vendido", `<b>${admEsc(sab[0].label)}</b> — ${fmtNum(sab[0].val)} pizza(s)`]);
      if(horas[0]) dest.push(["🔥 Horário de pico", `<b>${String(horas[0].label).padStart(2,"0")}h</b> — ${horas[0].val} pedido(s)`]);
      if(clientes[0]) dest.push(["⭐ Melhor cliente do período", `<b>${admEsc(nomeDe[clientes[0].label]||"")}</b> — ${fmtMoney(clientes[0].val)}`]);
      const pendPix = validos.filter(o=>temPix(o) && !o.pixConfirmado);
      const alertas = [];
      if(pendPix.length) alertas.push(`💳 ${pendPix.length} pedido(s) com Pix ainda <b>sem confirmação</b> (${fmtMoney(pendPix.reduce((a,o)=>a+(Number(o.valor)||0),0))}).`);
      if(A.erros.length) alertas.push(`🚨 ${A.erros.length} pedido(s) ficaram mais de ${limiteTxt()} parados (erro de gestão) — veja na aba Erros de gestão. Eles não entram nas médias de tempo.`);
      if(A.total >= 10 && A.cancelados/A.total > 0.1) alertas.push(`⚠️ Taxa de cancelamento alta: ${fmtPct(A.cancelados/A.total*100)} dos pedidos.`);
      if(A.noPrazo !== null && A.noPrazo < 70) alertas.push(`⏱ Só ${fmtPct(A.noPrazo)} das entregas saíram em até ${META_ENTREGA_MIN} min.`);
      const destaques = painel("Destaques e alertas",
        (dest.length ? `<ul class="adm-list">${dest.map(([t,v])=>`<li><span>${t}</span><span>${v}</span></li>`).join("")}</ul>` : '<div class="empty">Sem pedidos nesse período.</div>')
        + (alertas.length ? `<div class="adm-alertas">${alertas.map(a=>`<div>${a}</div>`).join("")}</div>` : ""));
      return kpis + `<div class="adm-grid">${grafico}${destaques}</div>`;
    },
    graficoHoras(lista, fnVal, fmt){
      const m = {};
      lista.forEach(o=>{ if(!o.horarios.pedido) return; const h = new Date(o.horarios.pedido).getHours(); m[h] = (m[h]||0) + fnVal(o); });
      const ordem = []; for(let h=5; h<24; h++) ordem.push(h); for(let h=0; h<5; h++) ordem.push(h);
      let ini = 0, fim = ordem.length-1;
      while(ini < fim && !m[ordem[ini]]) ini++;
      while(fim > ini && !m[ordem[fim]]) fim--;
      const itens = ordem.slice(ini, fim+1).map(h=>({ label: String(h).padStart(2,"0")+"h", val: m[h]||0 }));
      return vbars(itens, fmt, itens.length<=14);
    },

    /* ---------- Produtos ---------- */
    sec_produtos(){
      const { A, P, orders } = this.D;
      const validos = orders.filter(o=>o.status!=="Cancelada");
      const itens = []; validos.forEach(o=>(o.itens||[]).forEach(it=>itens.push(it)));
      const qt = it => parseInt(it.quantidade)||1;
      const totalPizzas = itens.reduce((a,it)=>a+qt(it),0);
      const meio = itens.filter(it=>it.meioAMeio && it.sabor2).reduce((a,it)=>a+qt(it),0);
      const comBorda = itens.filter(it=>it.borda).reduce((a,it)=>a+qt(it),0);
      const tam = somaPorChave(itens, it=>it.tamanho, qt);
      const bordas = somaPorChave(itens, it=>it.borda, qt);
      const beb = []; validos.forEach(o=>(o.bebidas||[]).forEach(b=>beb.push(b)));
      const bebidas = somaPorChave(beb, b=>b.nome, b=>parseInt(b.quantidade)||1);
      const sab = contaSabores(validos);
      const recPizza = itens.reduce((a,it)=>a+(Number(it.valor)||0),0);
      const recBeb = beb.reduce((a,b)=>a+(Number(b.valor)||0),0);
      const vendidos = new Set(sab.map(s=>s.label.trim().toLowerCase()));
      const parados = (this.saboresAll||[]).filter(s=>!vendidos.has(String(s.nome||"").trim().toLowerCase()));
      const kp = `<div class="admin-summary">
        ${kpi("pizzas vendidas", totalPizzas, delta(A.pizzas, P.pizzas))}
        ${kpi("bebidas vendidas", A.bebidas, delta(A.bebidas, P.bebidas))}
        ${kpi("pizzas meio a meio", fmtPct(totalPizzas ? meio/totalPizzas*100 : null))}
        ${kpi("pizzas com borda recheada", fmtPct(totalPizzas ? comBorda/totalPizzas*100 : null))}
        ${kpi("sabores diferentes vendidos", sab.length)}
      </div>`;
      const receita = hbars([{label:"Pizzas", val:recPizza},{label:"Bebidas", val:recBeb}].filter(x=>x.val>0), fmtMoney, recPizza+recBeb);
      return kp + `<div class="adm-grid">
        ${painel("Sabores mais vendidos", hbars(sab.slice(0,15), fmtNum, totalPizzas), "meio a meio conta ½ pizza para cada sabor")}
        ${painel("Tamanhos", hbars(tam, fmtNum, totalPizzas))}
        ${painel("Bordas", hbars(bordas, fmtNum, totalPizzas), "só pizzas com borda")}
        ${painel("Bebidas", hbars(bebidas.slice(0,12), fmtNum))}
        ${painel("Receita por tipo de produto", receita, "estimada pelos preços da tabela")}
        ${painel("Sabores sem nenhuma venda", parados.length ? `<div class="chips">${parados.slice(0,40).map(s=>`<span class="chip">${admEsc(s.nome)}</span>`).join("")}</div>` : '<div class="empty">Todos os sabores do cardápio venderam no período 🎉</div>', "candidatos a sair do cardápio ou ser divulgados")}
      </div>`;
    },

    /* ---------- Clientes ---------- */
    sec_clientes(){
      const { start, end } = this.D;
      const hoje = todayStr();
      const validos = (this.todos||[]).filter(o=>o.status!=="Cancelada");
      const mapa = {};
      validos.forEach(o=>{
        const id = normalizePhone(o.telefone) || ("nome:"+String(o.nome||"").toLowerCase());
        const c = mapa[id] || (mapa[id] = { id, nome:o.nome, telefone:o.telefone, pedidos:0, gasto:0, ultima:o.date, primeira:o.date, pPed:0, pGasto:0 });
        c.pedidos++; c.gasto += Number(o.valor)||0;
        if(o.date > c.ultima){ c.ultima = o.date; c.nome = o.nome; c.telefone = o.telefone; }
        if(o.date < c.primeira) c.primeira = o.date;
        if(o.date >= start && o.date <= end){ c.pPed++; c.pGasto += Number(o.valor)||0; }
      });
      const todosC = Object.values(mapa);
      const noPer = todosC.filter(c=>c.pPed>0);
      const novos = noPer.filter(c=>c.primeira >= start && c.primeira <= end).length;
      const recorrentes = noPer.length - novos;
      const recompra = todosC.length ? todosC.filter(c=>c.pedidos>=2).length/todosC.length*100 : null;
      const semPedido = (this.cad||[]).filter(c=>!mapa[c.id]).length;
      const wa = c => c.telefone ? `<a href="${admEsc(Clientes.waLink(c.telefone))}" target="_blank" rel="noopener">WhatsApp</a>` : "";
      const dias = c => diasEntre(c.ultima, hoje);
      const kp = `<div class="admin-summary">
        ${kpi("clientes que compraram no período", noPer.length)}
        ${kpi("clientes novos no período", novos)}
        ${kpi("clientes que voltaram a comprar", recorrentes)}
        ${kpi("taxa de recompra (2+ pedidos)", fmtPct(recompra))}
        ${kpi("cadastrados que nunca compraram", semPedido)}
      </div>`;
      const topPer = noPer.slice().sort((a,b)=>b.pGasto-a.pGasto).slice(0,10).map((c,i)=>[ (i+1)+"º", admEsc(c.nome), c.pPed, fmtMoney(c.pGasto), fmtMoney(c.pGasto/c.pPed), fmtDataLonga(c.ultima)+` <span class="dim">(${dias(c)} d)</span>` ]);
      const topAllRows = todosC.slice().sort((a,b)=>b.gasto-a.gasto).slice(0,10).map((c,i)=>[ (i+1)+"º", admEsc(c.nome), c.pedidos, fmtMoney(c.gasto), fmtMoney(c.gasto/c.pedidos), fmtDataLonga(c.ultima)+` <span class="dim">(${dias(c)} d)</span>` ]);
      const lim = this.sumidoDias;
      const sumidos = todosC.map(c=>({ ...c, dias:dias(c) })).filter(c=>c.dias>=lim).sort((a,b)=>b.dias-a.dias);
      const botoes = [15,30,60,90].map(d=>`<button type="button" class="tab-btn adm-lim${d===lim?" active":""}" data-d="${d}">${d}+ dias</button>`).join("");
      const sumRows = sumidos.slice(0,40).map(c=>[ admEsc(c.nome), c.pedidos, fmtMoney(c.gasto), fmtDataLonga(c.ultima), `<b>${c.dias} dias</b>`, wa(c) ]);
      const cab = ["#","Cliente","Pedidos","Gasto","Ticket","Última compra"];
      return kp + `<div class="adm-grid">
        ${painel("Quem mais comprou no período", tabelaSimples(cab, topPer))}
        ${painel("Melhores clientes de todos os tempos", tabelaSimples(cab, topAllRows), "por valor gasto, descontando cancelados")}
      </div>`
      + painel("Clientes que estão há mais tempo sem comprar",
          `<div class="tabs" style="margin:0 0 12px;">${botoes}</div>` +
          (sumidos.length ? `<div class="tag" style="margin-bottom:8px;">${sumidos.length} cliente(s) sem comprar há ${lim} dias ou mais${sumidos.length>40?" — mostrando os 40 mais antigos":""}</div>` : "") +
          tabelaSimples(["Cliente","Pedidos","Gasto total","Última compra","Sem comprar há",""], sumRows),
          "bom para chamar no WhatsApp com uma promoção");
    },

    /* ---------- Operação ---------- */
    sec_operacao(){
      const { A, P, orders } = this.D;
      const tempos = `<div class="admin-summary">
        ${kpi("produção (pedido → pronta)", fmtMinutes(A.avgProd), delta(A.avgProd||0, P.avgProd, true))}
        ${kpi("espera para sair (pronta → saída)", fmtMinutes(A.avgEspera), delta(A.avgEspera||0, P.avgEspera, true))}
        ${kpi("entrega (saída → entregue)", fmtMinutes(A.avgEntrega), delta(A.avgEntrega||0, P.avgEntrega, true))}
        ${kpi("total (pedido → entregue)", fmtMinutes(A.avgTotal), delta(A.avgTotal||0, P.avgTotal, true))}
        ${kpi("entregas em até "+META_ENTREGA_MIN+" min", fmtPct(A.noPrazo))}
      </div><div class="tag" style="margin:-8px 0 14px;">Os tempos não incluem pedidos com erro de gestão (mais de ${limiteTxt()} parados): ${A.erros.length} no período.</div>`;
      const lentos = A.entreguesOk
        .filter(o=>o.horarios.pedido && o.horarios.entrega)
        .map(o=>({ o, min:(new Date(o.horarios.entrega)-new Date(o.horarios.pedido))/60000 }))
        .sort((a,b)=>b.min-a.min).slice(0,5)
        .map(x=>[ "#"+x.o.numero, admEsc(x.o.nome), fmtDataLonga(x.o.date), `<b>${fmtMinutes(Math.round(x.min))}</b>` ]);
      const hoje = todayStr(), corte = addDias(hoje, -60);
      const recentes = (this.todos||[]).filter(o=>o.status!=="Cancelada" && o.date >= corte);
      const porHora = this.graficoHoras(recentes, o=>1, n=>String(n));
      const grp = {};
      recentes.forEach(o=>{
        const dow = parseYMD(o.date).getDay();
        const g = grp[dow] || (grp[dow] = { datas:new Set(), ped:0, fat:0 });
        g.datas.add(o.date); g.ped++; g.fat += Number(o.valor)||0;
      });
      const diasItens = [1,2,3,4,5,6,0].filter(d=>grp[d]).map(d=>({ label:DIAS_SEMANA[d], val:grp[d].fat/grp[d].datas.size, extra:fmtNum(grp[d].ped/grp[d].datas.size)+" pedidos/dia" }));
      return tempos + `<div class="adm-grid">
        ${painel("Pedidos por hora do dia", porHora, "últimos 60 dias — mostra seu horário de pico")}
        ${painel("Faturamento médio por dia da semana", hbars(diasItens, fmtMoney), "últimos 60 dias — média dos dias que funcionou")}
        ${painel("Entregas mais demoradas do período", tabelaSimples(["Nº","Cliente","Dia","Tempo total"], lentos))}
        ${painel("Cancelamentos", `<div class="admin-summary" style="margin:0;">${kpi("cancelados", A.cancelados, delta(A.cancelados, P.cancelados, true))}${kpi("taxa de cancelamento", fmtPct(A.total ? A.cancelados/A.total*100 : null))}</div>`)}
      </div>`;
    },

    /* ---------- Pagamentos ---------- */
    sec_pagamentos(){
      const { A, orders } = this.D;
      const validos = orders.filter(o=>o.status!=="Cancelada");
      const partes = []; validos.forEach(o=> pagamentosDe(o).forEach(p=> partes.push(p)));
      const porForma = somaPorChave(partes, p=>p.forma, p=>Number(p.valor)||0);
      const totalGeral = porForma.reduce((a,x)=>a+x.val,0);
      const contagem = somaPorChave(validos, o=>pagamentosDe(o).length>1 ? "Dividido em 2+ formas" : (o.pagamento||"—"), o=>1);
      const dividido = validos.filter(o=>pagamentosDe(o).length>1).length;
      const pix = validos.filter(o=>temPix(o));
      const pixPend = pix.filter(o=>!o.pixConfirmado);
      const valorPix = o => pagamentosDe(o).filter(p=>p.forma==="Pix").reduce((a,p)=>a+(Number(p.valor)||0),0);
      const dinheiro = partes.filter(p=>p.forma==="Dinheiro").reduce((a,p)=>a+(Number(p.valor)||0),0);
      const kp = `<div class="admin-summary">
        ${kpi("recebido em Pix", fmtMoney(pix.reduce((a,o)=>a+valorPix(o),0)))}
        ${kpi("Pix aguardando confirmação", pixPend.length)}
        ${kpi("dinheiro a receber dos entregadores", fmtMoney(dinheiro))}
        ${kpi("pedidos com pagamento dividido", dividido + (validos.length ? ` <small>(${fmtPct(dividido/validos.length*100)})</small>` : ""))}
      </div>`;
      const pendTab = tabelaSimples(["Nº","Cliente","Dia","Valor em Pix"], pixPend.slice(0,15).map(o=>[ "#"+o.numero, admEsc(o.nome), fmtDataLonga(o.date), fmtMoney(valorPix(o)) ]));
      return kp + `<div class="adm-grid">
        ${painel("Faturamento por forma de pagamento", hbars(porForma, fmtMoney, totalGeral), "pagamentos divididos entram em cada forma")}
        ${painel("Pedidos por forma de pagamento", hbars(contagem, fmtNum, validos.length))}
        ${painel("Pix ainda sem confirmação", pendTab)}
      </div>`;
    },

    /* ---------- Erros de gestão ---------- */
    sec_gestao(){
      const { A, P } = this.D;
      const lista = A.erros.slice().sort((a,b)=>b.e.min-a.e.min);
      const prod = lista.filter(x=>x.e.etapa==="Produção").length;
      const ent = lista.filter(x=>x.e.etapa==="Entrega").length;
      const abertos = lista.filter(x=>x.e.aberto).length;
      const fmtH = m=> fmtMinutes(Math.round(m));
      const kp = `<div class="admin-summary">
        ${kpi("erros de gestão", lista.length + (A.total ? ` <small>(${fmtPct(lista.length/A.total*100)} dos pedidos)</small>` : ""), delta(lista.length, P.erros.length, true))}
        ${kpi("erros de produção", prod)}
        ${kpi("erros de entrega", ent)}
        ${kpi("ainda sem resolver", abertos)}
      </div>`;
      const linhas = lista.map(({o,e})=>[
        "#"+o.numero, admEsc(o.nome), fmtDataLonga(o.date),
        `<b>${e.etapa}</b><br><span class="dim">${e.detalhe}</span>`,
        `<b>${fmtH(e.min)}</b>${e.aberto ? '<br><span class="dim">e contando</span>' : ""}`,
        `<span class="status-pill ${statusClass(o.status)}">${o.status}</span>`,
        admEsc(pagLabel(o)) + (temPix(o) ? (o.pixConfirmado ? " · Pix ok ✓" : " · Pix pendente") : "")
      ]);
      return kp + `<div class="tag" style="margin-bottom:12px;">Regra: pedido parado mais de ${limiteTxt()} na produção ou na entrega (pronta esperando sair ou em rota) é erro de gestão — mesmo que depois tenha sido entregue e pago (o limite pode ser mudado em Configurações). Esses pedidos ficam fora das médias de tempo; as vendas continuam somadas no faturamento.</div>`
        + painel("Pedidos com erro de gestão", tabelaSimples(["Nº","Cliente","Dia","Etapa","Tempo parado","Situação","Pagamento"], linhas));
    },

    /* ---------- Comandas (tabela + mapa de entregas) ---------- */
    sec_comandas(){
      return `<div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">

          <div id="admin-map" style="height:520px;border-radius:0;overflow:hidden;"></div>

        </div>
      </div>`;
    },
    applyView(){
      const tableEl = this.root.querySelector("#admin-table");
      const mapWrap = this.root.querySelector("#admin-map-wrap");
      const btn = this.root.querySelector("#toggle-admin-view-btn");
      if(!tableEl) return;
      if(this.view === "mapa"){
        tableEl.style.display = "none"; mapWrap.style.display = ""; btn.textContent = "📋 Ver comandas";
      } else {
        tableEl.style.display = ""; mapWrap.style.display = "none"; btn.textContent = "🗺️ Ver mapa de entregas";
      }
    },
    async montarComandas(){
      const { orders, start, end, A } = this.D;
      this.root.querySelector("#toggle-admin-view-btn").addEventListener("click", async ()=>{
        this.view = this.view === "mapa" ? "tabela" : "mapa";
        this.applyView();
        if(this.view === "mapa") await this.renderMap(A.entregues);
      });
      this.applyView();
      const tableEl = this.root.querySelector("#admin-table");
      if(!orders.length){
        tableEl.innerHTML = '<div class="empty">Nenhum pedido nesse período.</div>';
        if(this.view === "mapa") await this.renderMap([]);
        return;
      }
      const showDayCol = start !== end;
      const rows = orders.map(o => `
        <tr>
          <td class="num">#${o.numero}</td>
          ${showDayCol ? `<td class="num">${fmtDateBR(o.date)}</td>` : ""}
          <td>${o.nome}</td>
          <td>${orderPizzasSummary(o)}${o.bebidas && o.bebidas.length ? `<br><span class="dim">🥤 ${orderBebidasSummary(o)}</span>` : ""}</td>
          <td class="num">${fmtMoney(o.valor)}<br><span class="dim">${admEsc(pagLabel(o))}</span></td>
          <td><span class="status-pill ${statusClass(o.status)}">${o.status}</span>${erroGestao(o) ? '<br><span class="dl dl-down" title="Parado mais tempo que o limite numa etapa">⚠ erro de gestão</span>' : ""}</td>
          <td class="num">${fmtTime(o.horarios.pedido)}</td>
          <td class="num">${fmtTime(o.horarios.pronta)}</td>
          <td class="num">${fmtTime(o.horarios.saida)}</td>
          <td class="num">${fmtTime(o.horarios.entrega)}</td>
          <td class="dim">${fmtDuration(o.horarios.pedido, o.horarios.pronta)}</td>
          <td class="dim">${fmtDuration(o.horarios.saida, o.horarios.entrega)}</td>
          <td><strong>${fmtDuration(o.horarios.pedido, o.horarios.entrega)}</strong></td>
        </tr>
      `).join("");
      tableEl.innerHTML = `
        <div style="overflow-x:auto;">
        <table class="orders">
          <thead><tr>
            <th>Nº</th>${showDayCol ? "<th>Dia</th>" : ""}<th>Cliente</th><th>Pedido</th><th>Valor</th><th>Status</th>
            <th>Pedido</th><th>Pronta</th><th>Saída</th><th>Entregue</th>
            <th>Produção</th><th>Entrega</th><th>Total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      `;
      if(this.view === "mapa") await this.renderMap(A.entregues);
    },
    async renderMap(entregues){
      const statusEl = this.root.querySelector("#admin-map-status");
      if(!statusEl) return;
      const pontos = entregues.filter(o => o.entregaLat != null && o.entregaLng != null);
      if(!this.adminMap){
        this.adminMap = new maplibregl.Map({
          container: "admin-map",
          style: "https://tiles.openfreemap.org/styles/liberty",
          center: [-52.2064, -3.2033],
          zoom: 12
        });
        this.adminMap.addControl(new maplibregl.NavigationControl());
      }
      setTimeout(()=> this.adminMap && this.adminMap.resize(), 50);
      this.adminMapMarkers = this.adminMapMarkers || [];
      this.adminMapMarkers.forEach(m=>m.remove());
      this.adminMapMarkers = [];
      if(!pontos.length){
        statusEl.textContent = entregues.length
          ? "Nenhuma dessas entregas tem localização salva (só passam a ter a partir de agora, quando o entregador aperta Entregue)."
          : "Nenhuma entrega concluída nesse período.";
        return;
      }
      statusEl.textContent = `${pontos.length} de ${entregues.length} entrega(s) com localização salva nesse período.`;
      const bounds = new maplibregl.LngLatBounds();
      pontos.forEach(o=>{
        const pos = [o.entregaLng, o.entregaLat];
        const popup = new maplibregl.Popup({offset:20}).setHTML(
          `<strong>#${o.numero} · ${o.nome}</strong><br>${fmtDateBR(o.date)} às ${fmtTime(o.horarios.entrega)}<br><span style="color:var(--ink-soft)">${o.endereco||""}</span>`
        );
        const marker = new maplibregl.Marker({color:"#C1440E"}).setLngLat(pos).setPopup(popup).addTo(this.adminMap);
        this.adminMapMarkers.push(marker);
        bounds.extend(pos);
      });
      this.adminMap.fitBounds(bounds, {padding:60, maxZoom:16});
    }
  };

          const j = await Backup.lerArquivo(f);
          const resumo = Backup.ORDEM.map(t=> t+": "+(Array.isArray(j.tabelas[t]) ? j.tabelas[t].length : 0)).join("\n");
          const quando = j.gerado_em ? new Date(j.gerado_em).toLocaleString("pt-BR") : "data desconhecida";
          if(!confirm("Restaurar o backup de "+quando+"?\n\n"+resumo+"\n\nRegistros com o mesmo código serão SUBSTITUÍDOS pelos do backup. Nada que existe hoje e não está no backup será apagado.")) return;
          btn.disabled = true;
          const rel = await Backup.restaurar(j, (t,a,b)=>{ info.textContent = "Restaurando "+t+" ("+a+"/"+b+")..."; });
          const falhas = rel.filter(r=>!r.ok);
          info.textContent = falhas.length
            ? "Restaurado com problemas — "+falhas.map(r=>r.t+": "+r.msg).join(" | ")
            : "Restaurado com sucesso — "+rel.map(r=>r.t+" "+r.n).join(" · ");
          toast(falhas.length ? "Restauração com problemas, veja o aviso no quadro" : "Backup restaurado");
        }catch(err){ console.error(err); info.textContent = "Erro: "+(err.message||err); toast("Não consegui restaurar o backup"); }
        btn.disabled = false;
      });
      root.querySelector("#imp-auto").addEventListener("change", e=>{ Imprimir.setAuto(e.target.checked); toast(e.target.checked ? "Impressão automática ligada" : "Impressão automática desligada"); });
      Usuarios.montar(root.querySelector("#usuarios-panel"));
      root.querySelector("#limite-erro-salvar").addEventListener("click", async ()=>{
        const v = parseInt(root.querySelector("#limite-erro-min").value, 10);
        if(!(v >= 10)){ toast("Informe pelo menos 10 minutos"); return; }
        const ok = await salvarLimiteErro(v);
        root.querySelector("#limite-erro-info").textContent = "Atual: " + limiteTxt();
        toast(ok ? "Limite salvo: " + limiteTxt() : "Salvo só neste aparelho — rode o SQL add-configuracoes.sql para valer em todos");
      });
    },
    async refresh(){}
  };

  /* ---------- Posição a partir do link do Google Maps ---------- */
  function normLinkMaps(raw){
    const t = String(raw||"").trim();
    if(!t) return "";
    return /^https?:\/\//i.test(t) ? t : "https://"+t;
  }
  // Links curtos (maps.app.goo.gl, goo.gl/maps) não trazem a posição escrita neles.
  function ehLinkCurtoMaps(raw){
    try{
      const h = new URL(normLinkMaps(raw)).hostname.toLowerCase();
      return h === "goo.gl" || h.endsWith(".goo.gl") || h === "g.co";
    }catch(e){ return false; }
  }
  // Lê latitude/longitude de um link LONGO do Google Maps. Devolve null se o link não traz posição.
  function coordsFromMapsUrl(raw){
    if(!raw) return null;
    let t = String(raw);
    try{ t = decodeURIComponent(t); }catch(e){}
    const valido = (la, ln)=>{
      const lat = parseFloat(la), lng = parseFloat(ln);
      if(!isFinite(lat) || !isFinite(lng)) return null;
      if(Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
      if(lat === 0 && lng === 0) return null;
      return { lat, lng };
    };
    const padroes = [
      /!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/,   // pino exato do lugar
      /@(-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/,        // centro da tela do mapa
      /[?&](?:q|ll|query|destination|daddr|center|sll)=(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/
    ];
    for(const re of padroes){
      const m = t.match(re);
      if(m){ const r = valido(m[1], m[2]); if(r) return r; }
    }
    return null;
  }

      `;
      root.querySelector("#cli-search").addEventListener("input", e=>{
        this.query = e.target.value;
        this.ajustar = true;
        this.draw();
      });
      root.querySelector("#cli-new").addEventListener("click", ()=> this.openForm(null));
      root.querySelectorAll("#cli-visao .tab-btn").forEach(btn=>{
        btn.addEventListener("click", ()=> this.setVisao(btn.dataset.v));
      });
      this.ajustar = true;
      this.aplicarVisao();
      await this.refresh();
    },
    async refresh(){
      this.cache = await getClients();
      if(this.root && this.root.querySelector("#cli-list")) this.draw();
    },
    setVisao(v){
      this.visao = v === "mapa" ? "mapa" : "cards";
      try{ localStorage.setItem("clientes_visao", this.visao); }catch(e){}
      this.ajustar = true;
      this.aplicarVisao();
      this.draw();
    },
    aplicarVisao(){
      const mapa = this.visao === "mapa";
      this.root.querySelectorAll("#cli-visao .tab-btn").forEach(b=> b.classList.toggle("active", b.dataset.v === this.visao));
      this.root.querySelector("#cli-list").style.display = mapa ? "none" : "";
      this.root.querySelector("#cli-count").style.display = mapa ? "none" : "";
      this.root.querySelector("#cli-mapa-wrap").style.display = mapa ? "block" : "none";
    },
    filtrar(){
      const q = this.query.trim().toLowerCase();
      const qDigits = q.replace(/\D/g,"");
      return q ? this.cache.filter(c=>
        (c.nome||"").toLowerCase().includes(q) ||
        (c.endereco||"").toLowerCase().includes(q) ||
        (qDigits && (c.telefone||"").replace(/\D/g,"").includes(qDigits))
      ) : this.cache;
    },
    draw(){
      const list = this.filtrar();
      if(this.visao === "mapa") this.desenharMapa(list);
      else this.desenharCards(list);
    },
    desenharCards(list){
      const q = this.query.trim();
      const countEl = this.root.querySelector("#cli-count");
      countEl.textContent = q
        ? `${list.length} de ${this.cache.length} cliente(s)`
        : `${this.cache.length} cliente(s) cadastrado(s)`;
      const listEl = this.root.querySelector("#cli-list");
      if(!list.length){
        listEl.innerHTML = `<div class="empty" style="grid-column:1/-1;">${q ? "Nenhum cliente encontrado." : "Nenhum cliente cadastrado ainda."}</div>`;
        return;
      }
      listEl.innerHTML = list.map(c=>{
        const inicial = this.esc((c.nome||"?").trim().charAt(0).toUpperCase() || "?");
        const foto = c.foto_url
          ? `<img class="cli-photo" src="${this.esc(c.foto_url)}" data-foto="${this.esc(c.foto_url)}" alt="Foto da casa" title="Ampliar foto">`
          : `<div class="cli-photo cli-ph">${inicial}</div>`;
        return `
          <div class="cli-card">
            ${foto}
            <div class="cli-body">
              <div class="cli-name">${this.esc(c.nome)}</div>
              <div class="cli-sub">${this.esc(c.telefone)}</div>
              <div class="cli-sub">${this.esc(c.endereco)}</div>
              ${c.observacoes ? `<div class="cli-obs">${this.esc(c.observacoes)}</div>` : ""}
            </div>
            <div class="cli-actions">
              <a href="${this.waLink(c.telefone)}" target="_blank" rel="noopener">WhatsApp</a>
              <a href="${this.esc(this.mapsUrl(c))}" target="_blank" rel="noopener">Maps</a>
              <button type="button" class="cli-hist" data-id="${this.esc(c.id)}">Histórico</button>
              <button type="button" class="cli-edit" data-id="${this.esc(c.id)}">Editar</button>
              <button type="button" class="danger-text cli-del" data-id="${this.esc(c.id)}">Excluir</button>
            </div>
          </div>`;
      }).join("");
      listEl.querySelectorAll("img.cli-photo").forEach(img=>{
        img.addEventListener("click", ()=> this.openPhoto(img.dataset.foto));
      });
      listEl.querySelectorAll(".cli-hist").forEach(btn=>{
        btn.addEventListener("click", ()=> this.abrirHistorico(this.cache.find(c=>c.id===btn.dataset.id)));
      });
      listEl.querySelectorAll(".cli-edit").forEach(btn=>{
        btn.addEventListener("click", ()=> this.openForm(this.cache.find(c=>c.id===btn.dataset.id)));
      });
      listEl.querySelectorAll(".cli-del").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const c = this.cache.find(x=>x.id===btn.dataset.id);
          if(!c) return;
          if(confirm("Excluir o cadastro de "+c.nome+"?")){
            await deleteClient(c.id);
            toast("Cliente excluído");
            await this.refresh();
          }
        });
      });
    },
    /* ----- Visão de mapa: usa só o link do Google Maps salvo no cadastro ----- */
    desenharMapa(list){
      const statusEl = this.root.querySelector("#cli-mapa-status");
      if(typeof maplibregl === "undefined"){
        statusEl.textContent = "Não consegui carregar o mapa. Verifique a internet e recarregue a página.";
        return;
      }
      if(!this.map){
        this.map = new maplibregl.Map({
          container: "cli-mapa",
          style: "https://tiles.openfreemap.org/styles/liberty",
          center: [-52.2064, -3.2033],
          zoom: 12
        });
        this.map.addControl(new maplibregl.NavigationControl());
        this.ajustar = true;
      }
      setTimeout(()=>{ if(this.map) this.map.resize(); }, 50);
      this.atualizarPosicoes();
      this.pintarMarcadores(list);
    },
    atualizarPosicoes(){
      const curtos = [];
      this.cache.forEach(c=>{
        const link = (c.link_maps||"").trim();
        if(!link){ delete this.pos[c.id]; delete this.motivo[c.id]; return; }
        // 1) posição já guardada no cadastro para ESTE link
        if(c.lat != null && c.lng != null && c.geo_link === link){
          this.pos[c.id] = { lat:Number(c.lat), lng:Number(c.lng) }; delete this.motivo[c.id]; return;
        }
        // 2) posição já descoberta nesta sessão (caso o SQL ainda não tenha sido rodado)
        const memo = this.resolvidos[c.id];
        if(memo && memo.link === link){ this.pos[c.id] = { lat:memo.lat, lng:memo.lng }; delete this.motivo[c.id]; return; }
        // 3) link longo: a posição está escrita no próprio link
        const p = coordsFromMapsUrl(link);
        if(p){ this.pos[c.id] = p; delete this.motivo[c.id]; return; }
        delete this.pos[c.id];
        // 4) link curto: precisa do resolvedor no Supabase
        if(ehLinkCurtoMaps(link)){
          if(this.falhou[c.id] === link) return;
          this.motivo[c.id] = this.resolverIndisponivel
            ? "link curto — o resolvedor ainda não foi instalado"
            : "lendo o link...";
          curtos.push(c);
        } else {
          this.motivo[c.id] = "o link não traz a posição — copie o link do ponto no Google Maps";
        }
      });
      if(curtos.length && !this.resolverIndisponivel) this.resolverCurtos(curtos);
    },
    async resolverCurtos(lista){
      if(this.resolvendo) return;
      this.resolvendo = true;
      this.pintarMarcadores();
      const fila = lista.slice();
      const falha = (c, link, motivo)=>{ this.falhou[c.id] = link; this.motivo[c.id] = motivo; };
      const worker = async ()=>{
        while(fila.length && !this.resolverIndisponivel && this.map){
          const c = fila.shift();
          const link = (c.link_maps||"").trim();
          try{
            const { data, error } = await supabase.functions.invoke("resolver-link-maps", { body:{ url: normLinkMaps(link) } });
            if(error){
              const st = error.context && error.context.status;
              if(st === 404){
                this.resolverIndisponivel = true;
                this.motivo[c.id] = "link curto — o resolvedor ainda não foi instalado";
              } else if(st === 401 || st === 403){
                this.resolverIndisponivel = true;
                this.motivo[c.id] = "o resolvedor recusou o acesso (desligue a verificação de JWT da função)";
              } else {
                falha(c, link, "não consegui ler a posição deste link");
              }
              continue;
            }
            if(data && data.lat != null && data.lng != null){
              const p = { lat:Number(data.lat), lng:Number(data.lng) };
              this.pos[c.id] = p;
              this.resolvidos[c.id] = { link, lat:p.lat, lng:p.lng };
              delete this.motivo[c.id];
              await this.salvarGeo(c, p, link);
              this.pintarMarcadores();
            } else {
              falha(c, link, "não consegui ler a posição deste link");
            }
          }catch(e){
            console.error(e);
            falha(c, link, "falha de conexão ao ler o link");
          }
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      fila.forEach(c=>{ if(!this.pos[c.id]) this.motivo[c.id] = "link curto — o resolvedor ainda não foi instalado"; });
      this.resolvendo = false;
      this.ajustar = true;
      if(this.map) this.pintarMarcadores();
    },
    async salvarGeo(c, p, link){
      const { error } = await supabase.from("clientes").update({ lat:p.lat, lng:p.lng, geo_link:link }).eq("id", c.id);
      if(error){ this.semColunas = true; console.error(error); }
      else { c.lat = p.lat; c.lng = p.lng; c.geo_link = link; }
    },
    pintarMarcadores(list){
      if(!this.map) return;
      list = list || this.filtrar();
      this.markers.forEach(m=> m.remove());
      this.markers = [];
      const bounds = new maplibregl.LngLatBounds();
      const semPos = [];
      let naMapa = 0, semLink = 0, ultimo = null;
      list.forEach(c=>{
        if(!(c.link_maps||"").trim()){ semLink++; return; }
        const p = this.pos[c.id];
        if(!p){ semPos.push(c); return; }
        naMapa++;
        ultimo = p;
        const popup = new maplibregl.Popup({ offset:28 }).setHTML(
          `<strong>${this.esc(c.nome)}</strong><br>${this.esc(c.telefone)}<br>` +
          `<span style="color:var(--ink-soft)">${this.esc(c.endereco)}</span>` +
          (c.observacoes ? `<br><em>${this.esc(c.observacoes)}</em>` : "") +
          `<div class="cli-pop-links"><a href="${this.waLink(c.telefone)}" target="_blank" rel="noopener">WhatsApp</a>` +
          `<a href="${this.esc(this.mapsUrl(c))}" target="_blank" rel="noopener">Abrir no Maps</a></div>`
        );
        const marker = new maplibregl.Marker({ color:"#D63A2D" }).setLngLat([p.lng, p.lat]).setPopup(popup).addTo(this.map);
        this.markers.push(marker);
        bounds.extend([p.lng, p.lat]);
      });
      if(this.ajustar && naMapa){
        this.ajustar = false;
        if(naMapa === 1) this.map.flyTo({ center:[ultimo.lng, ultimo.lat], zoom:15 });
        else this.map.fitBounds(bounds, { padding:70, maxZoom:16, duration:0 });
      }
      const partes = [`${naMapa} no mapa`];
      if(semPos.length) partes.push(`${semPos.length} com link que o app não conseguiu ler`);
      if(semLink) partes.push(`${semLink} sem link (não aparecem)`);
      if(this.resolvendo) partes.push("lendo links curtos...");
      this.root.querySelector("#cli-mapa-status").textContent = partes.join(" · ");

      const semEl = this.root.querySelector("#cli-sem-pos");
      const estavaAberto = !!(semEl.querySelector("details") && semEl.querySelector("details").open);
      if(!semPos.length){ semEl.innerHTML = ""; return; }
      const dicas = [];
      if(this.resolverIndisponivel) dicas.push("Links curtos (maps.app.goo.gl) só podem ser lidos depois de instalar o resolvedor no Supabase.");
      if(this.semColunas) dicas.push("Rode o SQL add-localizacao-clientes para o mapa guardar as posições e abrir mais rápido.");
      semEl.innerHTML = `
        <details class="cli-sem-pos"${estavaAberto ? " open" : ""}>
          <summary>Clientes com link, mas sem posição (${semPos.length})</summary>
          <ul>${semPos.map(c=>`<li><strong>${this.esc(c.nome)}</strong> — ${this.esc(this.motivo[c.id] || "sem posição")}</li>`).join("")}</ul>
          ${dicas.map(d=>`<div class="tag">${this.esc(d)}</div>`).join("")}
        </details>`;
    },
    async abrirHistorico(c){
      if(!c) return;
      const holder = this.root.querySelector("#modal-holder");
      const fechar = ()=>{ holder.innerHTML = ""; };
      const casca = (corpo)=>{
        holder.innerHTML = `
          <div class="modal-backdrop" id="cli-hist-bd">
            <div class="modal" style="max-width:600px;">
              <h3 style="margin-top:0;">${this.esc(c.nome)} <span style="font-weight:400;color:var(--ink-soft);font-size:14px;">· ${this.esc(c.telefone)}</span></h3>
              ${corpo}
              <div class="actions"><button type="button" class="ghost" id="cli-hist-close" style="flex:1;">Fechar</button></div>
            </div>
          </div>`;
        holder.querySelector("#cli-hist-close").addEventListener("click", fechar);
        holder.querySelector("#cli-hist-bd").addEventListener("click", e=>{ if(e.target.id === "cli-hist-bd") fechar(); });
      };
      casca('<div class="empty">Carregando histórico...</div>');
      const todos = await getTodosPedidos();
      const lista = todos.filter(o=> normalizePhone(o.telefone) === c.id)
        .map(o=> ({...o})).sort((a,b)=> String(b.horarios.pedido||"").localeCompare(String(a.horarios.pedido||"")));
      if(!lista.length){ casca('<div class="empty">Este cliente ainda não fez nenhum pedido.</div>'); return; }
      await attachItems(lista);
      const validos = lista.filter(o=>o.status !== "Cancelada");
      const totalGasto = validos.reduce((a,o)=>a+(Number(o.valor)||0),0);
      const porForma = {};
      validos.forEach(o=> pagamentosDe(o).forEach(p=>{ if(p.forma) porForma[p.forma] = (porForma[p.forma]||0) + (Number(p.valor)||0); }));
      const dataBr = d=> String(d||"").split("-").reverse().join("/");
      const stats = `
        <div class="tl-stats">
          <div class="tl-stat"><b>${validos.length}</b><span>pedidos</span></div>
          <div class="tl-stat"><b>${fmtMoney(totalGasto)}</b><span>total gasto</span></div>
          <div class="tl-stat"><b>${validos.length ? fmtMoney(totalGasto/validos.length) : "—"}</b><span>ticket médio</span></div>
          <div class="tl-stat"><b>${dataBr((validos[0]||lista[0]).date)}</b><span>último pedido</span></div>
        </div>
        ${Object.keys(porForma).length ? `<div class="tl-pay">Por forma de pagamento: ${Object.keys(porForma).map(f=>`<b>${f}</b> ${fmtMoney(porForma[f])}`).join(" · ")}</div>` : ""}`;
      const itens = lista.map(o=>`
        <div class="tl-item ${o.status==="Cancelada"?"cancel":""}">
          <div class="tl-date">${dataBr(o.date)} · ${fmtTime(o.horarios.pedido)}</div>
          <div class="tl-box">
            <div class="tl-top"><b>Comanda #${o.numero}</b><span class="status-pill ${statusClass(o.status)}">${o.status}</span></div>
            ${o.itens && o.itens.length ? `<div>🍕 ${orderPizzasSummary(o)}</div>` : ""}
            ${o.bebidas && o.bebidas.length ? `<div>🥤 ${orderBebidasSummary(o)}</div>` : ""}
            <div class="tl-pay"><b style="color:var(--ink);">${fmtMoney(o.valor)}</b> · 💳 ${this.esc(pagLabel(o))}${o.troco?" · troco p/ "+this.esc(o.troco):""}</div>
            ${o.horarios.entrega ? `<div class="tl-pay">Entregue às ${fmtTime(o.horarios.entrega)} · ${fmtDuration(o.horarios.pedido, o.horarios.entrega)} do pedido à entrega</div>` : ""}
          </div>
        </div>`).join("");
      casca(stats + `<div class="tl">${itens}</div>`);
    },
    openPhoto(url){
      const holder = this.root.querySelector("#modal-holder");
      holder.innerHTML = `
        <div class="modal-backdrop" id="cli-foto-bd">
          <div class="modal" style="max-width:640px;padding:12px;">
            <img src="${this.esc(url)}" alt="Foto da casa" style="width:100%;display:block;">
            <div class="actions"><button type="button" class="ghost" id="cli-foto-close" style="flex:1;">Fechar</button></div>
          </div>
        </div>`;
      const close = ()=>{ holder.innerHTML = ""; };
      holder.querySelector("#cli-foto-close").addEventListener("click", close);
      holder.querySelector("#cli-foto-bd").addEventListener("click", e=>{ if(e.target.id === "cli-foto-bd") close(); });
    },
    closeForm(){
      this.root.querySelector("#modal-holder").innerHTML = "";
      this.editingId = null;
    },
    openForm(client){
      this.editingId = client ? client.id : null;
      const v = k => client ? this.esc(client[k] || "") : "";
      const holder = this.root.querySelector("#modal-holder");
      holder.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal" style="max-width:480px;">
            <h3>${client ? "Editar cliente" : "Novo cliente"}</h3>
            <form id="cli-form">
              <div class="field"><label>Nome</label><input name="nome" required value="${v("nome")}"></div>
              <div class="field"><label>Telefone</label><input name="telefone" required placeholder="(00) 00000-0000" value="${v("telefone")}"></div>
              <div class="field"><label>Endereço</label><textarea name="endereco" rows="2" required>${v("endereco")}</textarea></div>
              <div class="field"><label>Link do Google Maps (opcional)</label><input name="link_maps" placeholder="https://maps.app.goo.gl/..." value="${v("link_maps")}"></div>
              <div class="field"><label>Observações (opcional)</label><input name="observacoes" placeholder="Ex: referência conhecida, ponto de entrega" value="${v("observacoes")}"></div>
              <div class="field">
                <label>Foto da frente da casa (opcional)</label>
                <input type="file" accept="image/*" id="cli-foto-input">
                <div id="cli-foto-preview" style="margin-top:8px;">${client && client.foto_url ? `<img src="${this.esc(client.foto_url)}" style="max-width:160px;display:block;">` : ""}</div>
              </div>
              <div class="actions">
                <button type="submit" class="primary" style="flex:1;" id="cli-save">Salvar</button>
                <button type="button" class="ghost" id="cli-cancel">Cancelar</button>
              </div>
            </form>
          </div>
        </div>`;
      const form = holder.querySelector("#cli-form");
      form.querySelector('[name="nome"]').focus();
      holder.querySelector("#cli-cancel").addEventListener("click", ()=> this.closeForm());
      holder.querySelector("#cli-foto-input").addEventListener("change", e=>{
        const file = e.target.files[0];
        if(file) holder.querySelector("#cli-foto-preview").innerHTML = `<img src="${URL.createObjectURL(file)}" style="max-width:160px;display:block;">`;
      });
      form.addEventListener("submit", async e=>{
        e.preventDefault();
        const data = Object.fromEntries(new FormData(form).entries());
        const id = normalizePhone(data.telefone);
        if(!id){ toast("Informe um telefone válido"); return; }
        const existing = this.editingId ? this.cache.find(c=>c.id===this.editingId) : null;
        if(id !== this.editingId && this.cache.some(c=>c.id===id)){
          toast("Já existe um cliente com esse telefone — use Editar");
          return;
        }
        const saveBtn = holder.querySelector("#cli-save");
        saveBtn.disabled = true;
        const file = holder.querySelector("#cli-foto-input").files[0];
        if(file){
          toast("Enviando foto...");
          const url = await uploadClientPhoto(id, file);
          if(url) data.foto_url = url; else toast("Não consegui enviar a foto");
        } else if(existing && existing.foto_url){
          data.foto_url = existing.foto_url;
        }
        await upsertClient(data);
        if(existing && existing.id !== id) await deleteClient(existing.id);
        toast(existing ? "Cliente atualizado" : "Cliente cadastrado");
        this.closeForm();
        await this.refresh();
      });
    }
  };

  /* ================= TEMA + MENU LATERAL ================= */
  const Tema = {
    get(){
      try{ return localStorage.getItem("tema") === "light" ? "light" : "dark"; }catch(e){ return "dark"; }
    },
    set(t){
      try{ localStorage.setItem("tema", t); }catch(e){}
      document.documentElement.setAttribute("data-theme", t);
    }
  };

  /* ================= LOGIN / PERFIS ================= */
  const PERFIS = {
    dono:       { nome:"Administrador",       desc:"vê tudo (Administração, Cardápio e Estoque, Configurações)", inicio:"atendente",
                  telas:["atendente","producao","entregador","entregador-app","clientes","admin","estoque","config"] },
    atendente:  { nome:"Atendente",  desc:"lança pedidos, usa Clientes e preenche o Estoque do dia", inicio:"atendente", telas:["atendente","clientes","estoque"] },
    cozinha:    { nome:"Cozinha",    desc:"Produção e Estoque do dia", inicio:"producao", telas:["producao","estoque"] },
    entregador: { nome:"Entregador", desc:"só o app do entregador", inicio:"entregador-app", telas:["entregador-app"] }
  };
  const Auth = {
    ativo:false, pronto:false, carregando:false, falhaRede:false, semUsuarios:false, user:null, token:null,
    lerToken(){ try{ return localStorage.getItem("sessao_token"); }catch(e){ return null; } },
    guardar(t){ try{ if(t) localStorage.setItem("sessao_token", t); else localStorage.removeItem("sessao_token"); }catch(e){} },
    perfil(){ return this.user ? PERFIS[this.user.perfil] : null; },
    async iniciar(){
      if(this.carregando) return;
      this.carregando = true; this.falhaRede = false;
      try{
        const r = await supabase.rpc("app_tem_usuarios");
        if(r.error){
          const faltaSql = r.error.code === "PGRST202" || r.error.status === 404 || /could not find the function|does not exist/i.test(r.error.message||"");
          if(faltaSql) this.ativo = false;      // login ainda não instalado no Supabase: o app abre como antes
          else this.falhaRede = true;
        } else {
          this.ativo = true; this.semUsuarios = !r.data;
          const t = this.lerToken();
          if(t && !this.semUsuarios){
            const s2 = await supabase.rpc("app_sessao", { p_token:t });
            if(s2.error) this.falhaRede = true;
            else if(s2.data){ this.user = s2.data; this.token = t; }
            else this.guardar(null);
          }
        }
      }catch(e){ console.error(e); this.falhaRede = true; }
      this.pronto = true;
      this.carregando = false;
      route();
    },
    async entrar(usuario, senha){
      const { data, error } = await supabase.rpc("app_login", { p_usuario:usuario, p_senha:senha });
      if(error) throw new Error(error.message);
      this.aceitar(data);
    },
    async primeiroDono(nome, usuario, senha){
      const { data, error } = await supabase.rpc("app_primeiro_dono", { p_nome:nome, p_usuario:usuario, p_senha:senha });
      if(error) throw new Error(error.message);
      this.aceitar(data);
    },
    aceitar(d){
      this.token = d.token; this.guardar(d.token); this.semUsuarios = false;
      this.user = { id:d.id, nome:d.nome, usuario:d.usuario, perfil:d.perfil };
    },
    async sair(){
      const t = this.token;
      this.user = null; this.token = null; this.guardar(null);
      try{ if(t) await supabase.rpc("app_logout", { p_token:t }); }catch(e){}
      if(window.location.hash) window.location.hash = ""; else route();
    }
  };
  function irParaInicio(){
    const alvo = "#/" + (Auth.perfil().inicio || "");
    if(window.location.hash === alvo) route(); else window.location.hash = alvo;
  }
  document.addEventListener("click", e=>{
    const a = e.target.closest && e.target.closest("[data-sair]");
    if(a){ e.preventDefault(); Auth.sair(); }
  });

  function renderLogin(root){
    const primeira = Auth.semUsuarios;
    root.innerHTML = `
      <div class="landing">
        <div class="landing-card">
          <img class="landing-logo" src="data:image/webp;base64,${LOGO_B64}" alt="Nice Pizza Delivery">
          <h1>${primeira ? "Criar o primeiro usuário" : "Entrar"}</h1>
          <p>${primeira ? "Esse será o Administrador do sistema. Depois você cadastra os funcionários em Configurações." : "Digite o seu usuário e a sua senha."}</p>
          <form id="login-form" style="text-align:left;">
            ${primeira ? `<div class="field"><label>Seu nome</label><input id="lg-nome" required autocomplete="name"></div>` : ""}
            <div class="field"><label>Usuário</label><input id="lg-user" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus></div>
            <div class="field"><label>Senha</label><input id="lg-pass" type="password" required autocomplete="${primeira ? "new-password" : "current-password"}"></div>
            <div id="lg-erro" style="color:var(--tomato-dark);font-size:13px;margin-bottom:10px;display:none;"></div>
            <button type="submit" class="primary" style="width:100%;" id="lg-btn">${primeira ? "Criar e entrar" : "Entrar"}</button>
          </form>
        </div>
      </div>`;
    root.querySelector("#login-form").addEventListener("submit", async e=>{
      e.preventDefault();
      const btn = root.querySelector("#lg-btn"), erro = root.querySelector("#lg-erro");
      const usuario = root.querySelector("#lg-user").value.trim(), senha = root.querySelector("#lg-pass").value;
      btn.disabled = true; erro.style.display = "none";
      try{
        if(primeira) await Auth.primeiroDono(root.querySelector("#lg-nome").value.trim(), usuario, senha);
        else await Auth.entrar(usuario, senha);
        irParaInicio();
      }catch(err){
        erro.textContent = err.message || "Não foi possível entrar";
        erro.style.display = "block";
        btn.disabled = false;
        root.querySelector("#lg-pass").value = "";
        root.querySelector("#lg-pass").focus();
      }
    });
  }
  function renderFalhaRede(root){
    root.innerHTML = `
      <div class="landing"><div class="landing-card">
        <img class="landing-logo" src="data:image/webp;base64,${LOGO_B64}" alt="Nice Pizza Delivery">
        <h1>Sem conexão</h1>
        <p>Não consegui falar com o servidor. Confira a internet e tente de novo.</p>
        <button type="button" class="primary" id="tentar-de-novo" style="width:100%;">Tentar de novo</button>
      </div></div>`;
    root.querySelector("#tentar-de-novo").addEventListener("click", ()=>{ Auth.pronto = false; route(); });
  }

  /* ---- Cadastro de funcionários (Configurações) ---- */
  const Usuarios = {
    box:null, lista:[],
    async montar(box){
      this.box = box;
      if(!Auth.ativo){
        box.innerHTML = `<h2>Funcionários e login</h2><p class="tag">O login ainda não foi ativado. Rode o arquivo <b>add-login.sql</b> no SQL Editor do Supabase e recarregue o app.</p>`;
        return;
      }
      await this.carregar();
    },
    async carregar(){
      const { data, error } = await supabase.rpc("app_usuarios_listar", { p_token:Auth.token });
      if(error){ this.box.innerHTML = `<h2>Funcionários e login</h2><div class="empty">${admEsc(error.message)}</div>`; return; }
      this.lista = data || [];
      this.desenhar();
    },
    desenhar(){
      const cor = {dono:"var(--tomato)", atendente:"#3b82f6", cozinha:"#e0a030", entregador:"#3fb36b"};
      this.box.innerHTML = `
        <div class="us-head">
          <div class="cfg-head" style="margin:0;"><span class="cfg-ic">👥</span><h2>Funcionários e login</h2></div>
          <button type="button" class="primary" id="us-novo">+ Novo funcionário</button>
        </div>
        <p class="cfg-desc" style="margin-top:10px;">Cada pessoa entra com o próprio usuário e senha e só vê as telas do seu perfil.</p>
        <div id="us-lista" class="us-grid">${this.lista.map(u=>{
          const p = PERFIS[u.perfil] || { nome:u.perfil, desc:"" };
          return `
          <div class="us-card${u.ativo?"":" off"}">
            <div class="us-av" style="background:${cor[u.perfil]||"var(--ink-soft)"};">${admEsc((u.nome||"?").trim().charAt(0).toUpperCase())}</div>
            <div class="us-info">
              <div class="us-nome">${admEsc(u.nome)}</div>
              <div class="meta">@${admEsc(u.usuario)}</div>
              <div class="us-tags"><span class="us-badge" style="border-color:${cor[u.perfil]||"var(--line)"};color:${cor[u.perfil]||"var(--ink-soft)"};">${admEsc(p.nome)}</span>${u.ativo?"":'<span class="us-badge off">Desativado</span>'}</div>
            </div>
            <div class="us-acts">
              <button type="button" class="ghost us-edit" data-id="${u.id}">Editar</button>
              <button type="button" class="danger-text us-del" data-id="${u.id}">Excluir</button>
            </div>
          </div>`;}).join("") || '<div class="empty">Nenhum funcionário ainda.</div>'}</div>`;
      this.box.querySelector("#us-novo").addEventListener("click", ()=> this.form(null));
      this.box.querySelectorAll(".us-edit").forEach(b=> b.addEventListener("click", ()=> this.form(this.lista.find(u=>u.id===b.dataset.id))));
      this.box.querySelectorAll(".us-del").forEach(b=> b.addEventListener("click", async ()=>{
        const u = this.lista.find(x=>x.id===b.dataset.id);
        if(!u || !confirm("Excluir o funcionário "+u.nome+"? Ele não conseguirá mais entrar.")) return;
        const { error } = await supabase.rpc("app_usuario_excluir", { p_token:Auth.token, p_id:u.id });
        if(error){ toast(error.message); return; }
        toast("Funcionário excluído");
        this.carregar();
      }));
    },
    form(u){
      const bd = document.createElement("div");
      bd.className = "modal-backdrop";
      bd.innerHTML = `
        <div class="modal">
          <h3>${u ? "Editar funcionário" : "Novo funcionário"}</h3>
          <form id="us-form">
            <div class="field"><label>Nome</label><input id="us-nome" required value="${admEsc(u?u.nome:"")}"></div>
            <div class="field"><label>Usuário (para entrar)</label><input id="us-user" required autocapitalize="none" autocorrect="off" spellcheck="false" value="${admEsc(u?u.usuario:"")}"></div>
            <div class="field"><label>Senha</label><input id="us-pass" type="text" autocomplete="off" placeholder="${u ? "deixe em branco para manter a atual" : "mínimo 4 caracteres"}" ${u?"":"required"}></div>
            <div class="field"><label>Perfil</label>
              <select id="us-perfil">${Object.keys(PERFIS).map(k=>`<option value="${k}" ${u&&u.perfil===k?"selected":""}>${PERFIS[k].nome} — ${PERFIS[k].desc}</option>`).join("")}</select>
            </div>
            <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-bottom:12px;"><input type="checkbox" id="us-ativo" style="width:auto;" ${!u||u.ativo?"checked":""}> Ativo (pode entrar no sistema)</label>
            <div id="us-erro" style="color:var(--tomato-dark);font-size:13px;margin-bottom:10px;display:none;"></div>
            <div class="actions">
              <button type="submit" class="primary" id="us-salvar">Salvar</button>
              <button type="button" class="ghost" id="us-fechar">Fechar</button>
            </div>
          </form>
        </div>`;
      document.body.appendChild(bd);
      const fechar = ()=> bd.remove();
      bd.querySelector("#us-fechar").addEventListener("click", fechar);
      bd.addEventListener("click", e=>{ if(e.target === bd) fechar(); });
      bd.querySelector("#us-form").addEventListener("submit", async e=>{
        e.preventDefault();
        const btn = bd.querySelector("#us-salvar"), erro = bd.querySelector("#us-erro");
        btn.disabled = true; erro.style.display = "none";
        const { error } = await supabase.rpc("app_usuario_salvar", {
          p_token:Auth.token, p_id:u ? u.id : null,
          p_nome:bd.querySelector("#us-nome").value, p_usuario:bd.querySelector("#us-user").value,
          p_senha:bd.querySelector("#us-pass").value, p_perfil:bd.querySelector("#us-perfil").value,
          p_ativo:bd.querySelector("#us-ativo").checked
        });
        if(error){ erro.textContent = error.message; erro.style.display = "block"; btn.disabled = false; return; }
        fechar();
        toast("Funcionário salvo");
        this.carregar();
      });
    }
  };

  const NAV_ITENS = [
    { hash:"atendente", t:"Atendente", s:"Lançar pedidos",
      icon:"M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" },
    { hash:"producao", t:"Produção", s:"Cozinha",
      icon:"M12 2C8.43 2 5.23 3.54 3.01 6L12 22l8.99-16C18.77 3.54 15.57 2 12 2zM7 7c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm5 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" },
    { hash:"entregador", t:"Entregador", s:"Rota de entregas",
      icon:"M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z" },
    { hash:"clientes", t:"Clientes", s:"Cadastro e endereços",
      icon:"M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" },
    { hash:"admin", t:"Administração", s:"Resumo, histórico e mapa",
      icon:"M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z" },
    { hash:"estoque", t:"Cardápio e Estoque", s:"Sabores, preços e estoque",
      icon:"M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4l16-.02V7z" },
    { hash:"config", t:"Configurações", s:"Equipe e regras",
      icon:"M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z" }
  ];
  const BURGER_PATH = "M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z";

  function updateConn(){
    const dot = document.querySelector(".sb-dot");
    const lbl = document.querySelector(".sb-conn");
    if(!dot || !lbl) return;
    const on = navigator.onLine;
    dot.classList.toggle("off", !on);
    lbl.textContent = on ? "Conectado" : "Sem internet";
  }
  window.addEventListener("online", updateConn);
  window.addEventListener("offline", updateConn);

  function buildShell(root, ativo){
    let colapsado = false;
    try{ colapsado = localStorage.getItem("menu_colapsado") === "1"; }catch(e){}
    const permitidas = (Auth.ativo && Auth.user) ? Auth.perfil().telas : null;
    const soEst = Auth.ativo && Auth.user && Auth.user.perfil !== "dono";
    const itens = NAV_ITENS.filter(it=> !permitidas || permitidas.includes(it.hash)).map(it=> (soEst && it.hash==="estoque") ? { ...it, t:"Estoque do dia", s:"Massa e bebidas do dia" } : it).map(it=>`
      <a class="sb-item${it.hash===ativo?" active":""}" href="#/${it.hash}" title="${it.t}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${it.icon}"/></svg>
        <span class="sb-text"><span class="t">${it.t}</span><span class="s">${it.s}</span></span>
      </a>`).join("");
    root.innerHTML = `
      <div class="shell${colapsado?" collapsed":""}">
        <aside class="sidebar">
          <div class="sb-head">
            <a class="sb-logo" href="#/" title="Início"><img src="data:image/webp;base64,${LOGO_B64}" alt="Nice Pizza Delivery"></a>
            <button type="button" class="sb-toggle" aria-label="Recolher menu"><svg viewBox="0 0 24 24"><path d="${BURGER_PATH}"/></svg></button>
          </div>
          <div class="sb-ver sb-text">Nice Pizza Delivery</div>
          <nav class="sb-nav">${itens}</nav>
          <button type="button" class="sb-tema" data-tema-toggle title="Mudar cor (claro/escuro)"><span class="tm-ic">${Tema.get()==="light"?"🌙":"☀️"}</span><span class="sb-text tm-tx">${Tema.get()==="light"?"Tema escuro":"Tema claro"}</span></button>
          <div class="sb-foot"><span class="sb-dot"></span><span class="sb-conn sb-text">Conectado</span></div>
          ${(Auth.ativo && Auth.user) ? `<div class="sb-user"><div class="sb-text" style="min-width:0;"><div class="u">${admEsc(Auth.user.nome)}</div><div class="p">${admEsc(Auth.perfil().nome)}</div></div><button type="button" class="sb-logout" data-sair title="Sair"><svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></button></div>` : ""}
        </aside>
        <div class="sb-backdrop"></div>
        <button type="button" class="sb-burger-m" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="${BURGER_PATH}"/></svg></button>
        <div class="content" id="screen-root"></div>
      </div>`;
    const shell = root.querySelector(".shell");
    root.querySelector(".sb-toggle").addEventListener("click", ()=>{
      if(window.matchMedia("(max-width:820px)").matches){
        shell.classList.remove("open");
        return;
      }
      const c = shell.classList.toggle("collapsed");
      try{ localStorage.setItem("menu_colapsado", c ? "1" : "0"); }catch(e){}
    });
    root.querySelector("[data-tema-toggle]").addEventListener("click", e=>{
      const novo = Tema.get()==="light" ? "dark" : "light";
      Tema.set(novo);
      const b = e.currentTarget;
      b.querySelector(".tm-ic").textContent = novo==="light" ? "🌙" : "☀️";
      b.querySelector(".tm-tx").textContent = novo==="light" ? "Tema escuro" : "Tema claro";
    });
    root.querySelector(".sb-burger-m").addEventListener("click", ()=> shell.classList.add("open"));
    root.querySelector(".sb-backdrop").addEventListener("click", ()=> shell.classList.remove("open"));
    root.querySelectorAll(".sb-item").forEach(a=> a.addEventListener("click", ()=> shell.classList.remove("open")));
    updateConn();
    return root.querySelector("#screen-root");
  }

  function route(){
    stopPolling();
    const root = document.getElementById("app");
    if(!Auth.pronto){
      root.innerHTML = '<div class="landing"><div class="landing-card"><p>Carregando...</p></div></div>';
      Auth.iniciar();
      return;
    }
    if(Auth.falhaRede){ renderFalhaRede(root); return; }
    if(Auth.ativo && !Auth.user){ renderLogin(root); return; }
    const hash = window.location.hash.replace(/^#\/?/,"");
    if(Auth.ativo){
      const p = Auth.perfil();
      if((hash === "" && p.inicio) || (hash !== "" && !p.telas.includes(hash))){
        window.location.hash = "#/" + (p.inicio || "");
        return;
      }
    }
    if(hash === ""){ window.location.hash = "#/atendente"; return; } // sem tela inicial: abre direto no Atendente
    const comMenu = ["atendente","producao","entregador","clientes","admin","config","estoque"].includes(hash);
    const tela = comMenu ? buildShell(root, hash) : root;
    if(hash === "atendente"){
      Atendente.render(tela);
      pollTimer = setInterval(()=> Atendente.refresh(), 4000);
      liveChannels.push(subscribeToTable("pedidos", ()=> Atendente.refresh()));
      liveChannels.push(subscribeToTable("sabores", ()=> Atendente.loadSaboresCache()));
      liveChannels.push(subscribeToTable("bebidas", ()=> Atendente.loadBebidasCache()));
      liveChannels.push(subscribeToTable("bordas", ()=> Atendente.loadBordasCache()));
      liveChannels.push(subscribeToTable("estoque_massa", ()=> Atendente.loadEstoqueMassa()));
      liveChannels.push(subscribeToTable("localizacao_entregador", ()=> Atendente.updateRastreamentoMarker()));
      liveChannels.push(subscribeToTable("rastreamento_config", async ()=>{
        Atendente.rastreamentoAtivo = await getRastreamentoAtivo();
        Atendente.updateRastreamentoBtn();
      }));
    } else if(hash === "producao"){
      Producao.render(tela);
      pollTimer = setInterval(()=> Producao.refresh(), 4000);
      liveChannels.push(subscribeToTable("pedidos", ()=> Producao.refresh()));
    } else if(hash === "entregador" || hash === "entregador-app"){
      Entregador.render(tela, hash === "entregador-app");
      pollTimer = setInterval(()=> Entregador.refresh(), 4000);
      liveChannels.push(subscribeToTable("pedidos", ()=> Entregador.refresh()));
      liveChannels.push(subscribeToTable("rastreamento_config", ()=> Entregador.onTrackingConfigChange()));
    } else if(hash === "admin"){
      if(Auth.ativo || sessionStorage.getItem("admin_unlocked") === "1"){
        Administracao.render(tela);
        pollTimer = setInterval(()=> Administracao.refresh(), 8000);
        liveChannels.push(subscribeToTable("pedidos", ()=> Administracao.refresh()));
      } else {
        renderAdminLogin(tela, route);
      }
    } else if(hash === "clientes"){
      Clientes.render(tela);
      liveChannels.push(subscribeToTable("clientes", ()=> Clientes.refresh()));
    } else if(hash === "config"){
      Configuracoes.render(tela);
    } else if(hash === "estoque"){
      Estoque.render(tela);
      liveChannels.push(subscribeToTable("bebidas", ()=> Estoque.refresh()));
      liveChannels.push(subscribeToTable("sabores", ()=> Estoque.refresh()));
      liveChannels.push(subscribeToTable("bordas", ()=> Estoque.refresh()));
      liveChannels.push(subscribeToTable("estoque_massa", ()=> Estoque.refresh()));
    } else {
      renderLanding(root);
    }
  }

  function subscribeToTable(table, onChange){
    return supabase
      .channel(table+"-live-"+Math.random().toString(36).slice(2))
      .on("postgres_changes", { event: "*", schema: "public", table }, onChange)
      .subscribe();
  }

  carregarHoraVirada().then(h=>{ if(h !== HORA_VIRADA_ANTES) route(); });
  window.addEventListener("hashchange", route);
  window.addEventListener("DOMContentLoaded", route);
  if(document.readyState !== "loading") route();
})();
</script>
</body>
</html>
