<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pizzaria — Pedidos</title>
<script>try{document.documentElement.setAttribute("data-theme", localStorage.getItem("tema")==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="dark"]{
    --bg:#14161B; --sidebar:#181B21; --card:#1E232C; --cream:#1A1F27; --field:#14181F;
    --ink:#E8EAEE; --ink-soft:#9BA4B3; --line:#2E3541;
    --tomato:#DC4639; --tomato-dark:#F0685B; --tomato-tint:#3A1F1D;
    --basil:#5CC27A; --basil-tint:#1B3225;
    --yolk:#E3A33A; --yolk-tint:#3A2E17; --yolk-ink:#F0C46E;
    --blue-bg:#1B2B3D; --blue-fg:#7DB4E6;
    --gray-bg:#2A2F38; --gray-fg:#9BA4B3;
    --red-bg:#3A1D1D; --red-fg:#E88A8A;
    --toast-bg:#E8EAEE; --toast-fg:#14161B;
    --radius:0;
    --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
    --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#F1F2F4; --sidebar:#FFFFFF; --card:#FFFFFF; --cream:#F6F7F9; --field:#FFFFFF;
    --ink:#14161B; --ink-soft:#5B6472; --line:#D8DBE1;
    --tomato:#D63A2D; --tomato-dark:#B22B20; --tomato-tint:#FBE3E0;
    --basil:#2F7D4A; --basil-tint:#DFF0E5;
    --yolk:#D98F1F; --yolk-tint:#FBEBD2; --yolk-ink:#7A5305;
    --blue-bg:#DCEAF7; --blue-fg:#2E5F8A;
    --gray-bg:#EDEDED; --gray-fg:#555555;
    --red-bg:#F5DADA; --red-fg:#8A2E2E;
    --toast-bg:#14161B; --toast-fg:#FFFFFF;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  a{color:inherit;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:0;
    font-size:15px;
    font-weight:600;
    padding:12px 18px;
    transition:transform .06s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  button.primary{background:var(--tomato);color:#fff;}
  button.primary:hover{background:var(--tomato-dark);}
  button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  button.success{background:var(--basil);color:#fff;}
  button.warn{background:var(--yolk);color:#3a2a05;}
  button.danger-text{background:transparent;color:var(--tomato-dark);padding:6px 8px;font-weight:500;font-size:13px;}
  button.danger-btn{background:transparent;border:1px solid var(--tomato-dark);color:var(--tomato-dark);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  input,select,textarea{
    font-family:inherit;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:0;
    background:var(--field);
    color:var(--ink);
    width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--tomato);outline-offset:1px;}
  label{font-size:13px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:4px;}
  .field{margin-bottom:14px;}
  .form-section{padding-top:16px;margin-top:6px;border-top:1px solid var(--line);}
  .form-section:first-child{padding-top:0;margin-top:0;border-top:none;}
  .section-title{font-size:13px;font-weight:700;color:var(--tomato-dark);margin-bottom:12px;}
  .item-block{background:var(--cream);border:1px solid var(--line);border-radius:0;padding:12px;margin-bottom:10px;}
  .item-block-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .item-subtotal{font-size:13px;color:var(--ink-soft);text-align:right;margin-top:4px;}
  .row{display:flex;gap:10px;}
  .row > .field{flex:1;}

  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;border-bottom:1px solid var(--line);
    background:var(--card);
    position:sticky;top:0;z-index:10;
  }
  header.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  header.topbar .tag{font-size:12px;color:var(--ink-soft);}
  .home-link{font-size:13px;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:0;}

  main{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}

  /* Landing */
  .landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .landing-card{max-width:480px;width:100%;text-align:center;}
  .landing-logo{width:180px;height:180px;border-radius:50%;object-fit:cover;margin-bottom:18px;box-shadow:0 0 0 4px var(--card);}
  .landing-card h1{font-size:26px;margin:0 0 6px;}
  .landing-card p{color:var(--ink-soft);margin:0 0 28px;font-size:15px;}
  .role-links{display:flex;flex-direction:column;gap:12px;}
  .role-btn{
    display:block;padding:18px;border-radius:0;
    text-decoration:none;font-weight:700;font-size:16px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    text-align:left;position:relative;
  }
  .role-btn .sub{display:block;font-weight:400;font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .role-btn.atendente{border-left:5px solid var(--tomato);}
  .role-btn.producao{border-left:5px solid var(--yolk);}
  .role-btn.entregador{border-left:5px solid var(--basil);}
  .role-btn.admin{border-left:5px solid var(--ink);}
  .role-btn.config{border-left:5px solid var(--ink-soft);}
  .role-btn.estoque{border-left:5px solid var(--yolk);}

  .admin-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:14px 18px;flex:1;min-width:130px;}
  .stat-card .val{font-size:22px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .stat-card .label{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .admin-datebar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .admin-datebar input[type="date"]{width:auto;}
  table.orders td.dim{color:var(--ink-soft);}

  /* Atendente layout */
  .atendente-layout{display:flex;gap:24px;align-items:flex-start;}
  .form-col{flex:0 0 360px;}
  .list-col{flex:1;min-width:0;}
  @media (max-width:820px){
    .atendente-layout{flex-direction:column;}
    .form-col{flex:1;width:100%;}
  }
  .panel{background:var(--card);border:1px solid var(--line);border-radius:0;padding:18px;}
  .panel + .panel{margin-top:16px;}
  .panel h2{font-size:15px;margin:0 0 14px;}

  .search-box{margin-bottom:12px;}

  .tabs{display:inline-flex;flex-wrap:wrap;gap:4px;margin-bottom:18px;padding:6px;background:var(--card);border:1px solid var(--line);}
  .tab-btn{background:transparent;border:none;padding:10px 16px;margin:0;font-size:14px;font-weight:600;color:var(--ink-soft);}
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{background:var(--tomato);color:#fff;}

  .autocomplete-wrap{position:relative;}
  .suggestions{
    position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);
    border-top:none;border-radius:0;max-height:220px;overflow:auto;z-index:20;
    box-shadow:0 6px 14px rgba(0,0,0,.08);
  }
  .suggestions .sugg-item{padding:9px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line);}
  .suggestions .sugg-item:last-child{border-bottom:none;}
  .suggestions .sugg-item:hover{background:var(--cream);}
  .suggestions .sugg-item .sname{font-weight:600;}
  .suggestions .sugg-item .sphone{color:var(--ink-soft);font-size:12px;}
  .selected-client{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--basil-tint);color:var(--basil);padding:8px 12px;border-radius:0;
    font-size:13px;font-weight:600;margin-bottom:14px;
  }
  .selected-client button{background:transparent;color:var(--basil);padding:2px 6px;font-size:12px;text-decoration:underline;}

  .client-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .client-thumb{width:44px;height:44px;border-radius:0;object-fit:cover;flex-shrink:0;}
  .casa-thumb{width:100%;max-height:220px;object-fit:cover;border-radius:0;margin-top:8px;display:block;}
  .foto-box{margin-top:8px;}
  .client-row:last-child{border-bottom:none;}
  .client-row .info .name{font-weight:700;font-size:14px;}
  .client-row .info .sub{font-size:13px;color:var(--ink-soft);}
  .client-row .actions{display:flex;gap:6px;flex-shrink:0;}
  .client-row .actions button{padding:6px 9px;font-size:12px;}

  table.orders{width:100%;border-collapse:collapse;font-size:14px;}
  table.orders th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);}
  table.orders td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.orders tr:last-child td{border-bottom:none;}
  .status-pill{display:inline-block;padding:3px 9px;border-radius:0;font-size:12px;font-weight:600;white-space:nowrap;}
  .status-Pendente{background:var(--yolk-tint);color:var(--yolk-ink);}
  .status-EmProducao{background:var(--tomato-tint);color:var(--tomato-dark);}
  .status-Pronta{background:var(--basil-tint);color:var(--basil);}
  .status-Saiu,.status-Saiuparaentrega{background:var(--blue-bg);color:var(--blue-fg);}
  .status-Entregue{background:var(--gray-bg);color:var(--gray-fg);}
  .status-Cancelada{background:var(--red-bg);color:var(--red-fg);text-decoration:line-through;}

  .empty{color:var(--ink-soft);font-size:14px;padding:20px 4px;text-align:center;}

  /* Producao */
  .prod-columns{display:flex;gap:18px;}
  .prod-col{flex:1;min-width:0;}
  .prod-col h2{display:flex;align-items:center;justify-content:space-between;font-size:15px;}
  .count-badge{background:var(--line);color:var(--ink);border-radius:0;padding:1px 9px;font-size:12px;}
  @media (max-width:720px){.prod-columns{flex-direction:column;}}
  .order-card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:14px;margin-bottom:12px;}
  .order-card.late{border-color:var(--tomato);box-shadow:0 0 0 1px var(--tomato) inset;}
  .deliv-card.late{border-color:var(--tomato);box-shadow:0 0 0 1px var(--tomato) inset;}
  .order-card .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .order-card .numero{font-size:20px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .order-card .timer-pill{font-size:14px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--cream);border:1px solid var(--line);border-radius:0;padding:3px 12px;color:var(--ink);}
  .order-card.late .timer-pill{background:var(--tomato);color:#fff;border-color:var(--tomato);}
  .order-card .meta{font-size:14px;color:var(--ink);font-weight:400;margin-top:2px;}
  .order-card .obs{font-size:14px;color:var(--ink);font-weight:400;margin-top:8px;background:var(--yolk-tint);padding:6px 9px;border-radius:0;}
  .order-card .footer{font-size:13px;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px solid var(--line);}
  .order-card .actions{margin-top:12px;display:flex;gap:8px;}
  .flavor-line{font-size:17px;color:var(--ink);font-weight:700;margin-top:0;}
  .pizza-item-line{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .pizza-item-line:last-of-type{border-bottom:none;padding-bottom:0;}

  /* Entregador */
  .deliv-section h2{font-size:14px;color:var(--ink-soft);text-transform:none;margin:22px 0 10px;}
  .deliv-card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:16px;margin-bottom:12px;}
  .deliv-card .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .deliv-card .numero{font-size:20px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .deliv-card .timer-pill{font-size:14px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--cream);border:1px solid var(--line);border-radius:0;padding:3px 12px;color:var(--ink);}
  .deliv-card.late .timer-pill{background:var(--tomato);color:#fff;border-color:var(--tomato);}
  .deliv-card .addr{font-size:17px;font-weight:700;margin:0;}
  .deliv-card .meta{font-size:14px;color:var(--ink);margin-top:4px;}
  .deliv-card .pay{display:block;margin-top:8px;font-size:14px;background:var(--yolk-tint);padding:6px 9px;border-radius:0;}
  .deliv-card .footer{font-size:13px;color:var(--ink-soft);margin-top:10px;padding-top:8px;border-top:1px solid var(--line);}
  .deliv-card .linkrow{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .deliv-card .linkrow a{font-size:13px;text-decoration:none;color:var(--tomato-dark);border:1px solid var(--line);padding:8px 10px;border-radius:0;}
  .deliv-card .actions{margin-top:12px;}
  .deliv-card .addr-locked{font-size:17px;font-weight:700;color:var(--ink-soft);}
  .bebida-check{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--basil-tint);color:var(--basil);padding:8px 10px;border-radius:0;margin-top:8px;font-weight:600;}
  .pix-lock-note{font-size:14px;background:var(--yolk-tint);color:var(--yolk-ink);padding:8px 10px;border-radius:0;margin-top:8px;font-weight:600;}
  .bebida-check input{width:auto;}
  .link-disabled{font-size:13px;color:var(--ink-soft);border:1px solid var(--line);padding:8px 10px;border-radius:0;opacity:.6;cursor:not-allowed;}
  .deliv-card .actions button{width:100%;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--toast-bg);color:var(--toast-fg);padding:10px 18px;border-radius:0;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s ease, bottom .25s ease;
    z-index:100;
  }
  .toast.show{opacity:1;bottom:32px;}

  .pag-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .pag-row select{flex:1;}
  .pag-row input.pag-valor{width:120px;flex:0 0 120px;}
  .pag-resumo{margin:2px 0 8px;font-size:13px;color:var(--ink-soft);}
  .pag-resumo.erro{color:var(--red-fg);}
  details.deliv-det > summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none;}
  details.deliv-det > summary::-webkit-details-marker{display:none;}
  details.deliv-det > summary::after{content:"▾";color:var(--ink-soft);}
  details.deliv-det[open] > summary::after{content:"▴";}
  .deliv-det-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .tl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0;}
  .tl-stat{border:1px solid var(--line);padding:8px 10px;background:var(--cream);}
  .tl-stat b{display:block;font-size:20px;font-family:var(--font-display);}
  .tl-stat span{font-size:12px;color:var(--ink-soft);}
  .tl{position:relative;margin:16px 0 4px 8px;padding-left:22px;border-left:2px solid var(--line);}
  .tl-item{position:relative;margin-bottom:16px;}
  .tl-item::before{content:"";position:absolute;left:-29px;top:3px;width:12px;height:12px;background:var(--tomato);border:2px solid var(--card);}
  .tl-item.cancel::before{background:var(--gray-fg);}
  .tl-date{font-size:12px;color:var(--ink-soft);}
  .tl-box{background:var(--cream);border:1px solid var(--line);padding:10px 12px;margin-top:4px;font-size:14px;}
  .tl-box .tl-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;}
  .tl-pay{margin-top:6px;font-size:13px;color:var(--ink-soft);}
  .cfg-card{display:flex;flex-direction:column;}
  .cfg-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .cfg-head h2{margin:0 !important;}
  .cfg-ic{width:38px;height:38px;display:grid;place-items:center;background:var(--cream);border:1px solid var(--line);font-size:19px;flex:none;}
  .cfg-desc{font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 18px;}
  .cfg-ctl{margin-top:auto;display:flex;gap:10px;align-items:flex-end;}
  .cfg-ctl .field{margin-bottom:0;}
  .cfg-now{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);}
  .cfg-switch{cursor:pointer;align-items:center;font-size:15px;color:var(--ink);}
  .cfg-switch input{position:absolute;opacity:0;pointer-events:none;}
  .cfg-switch .sw{width:46px;height:26px;background:var(--line);position:relative;flex:none;transition:background .15s;}
  .cfg-switch .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--ink);transition:transform .15s;}
  .cfg-switch input:checked + .sw{background:var(--tomato);}
  .cfg-switch input:checked + .sw::after{transform:translateX(20px);background:#fff;}
  .cfg-sec{font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:22px 0 10px;}
  .cfg-sec:first-child{margin-top:4px;}
  .cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:stretch;}
  .cfg-grid > .panel, #usuarios-panel{margin:0;max-width:none;width:100%;}
  .adm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;margin-bottom:14px;}
  .adm-grid > .panel.adm-panel{margin:0;min-width:0;}
  .adm-panel h2{margin-top:0;}
  .dlrow{margin-top:4px;font-size:12px;}
  .dl{color:var(--ink-soft);font-weight:600;}
  .dl-up{color:var(--basil);}
  .dl-down{color:var(--tomato-dark);}
  .stat-card .val small{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .hbars{display:flex;flex-direction:column;gap:8px;}
  .hbar{display:grid;grid-template-columns:minmax(70px,32%) 1fr auto;gap:10px;align-items:center;font-size:13px;}
  .hbar .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar .hb{background:var(--cream);border:1px solid var(--line);height:14px;}
  .hbar .hb span{display:block;height:100%;background:var(--tomato);}
  .hbar .hv{text-align:right;white-space:nowrap;font-weight:600;}
  .hbar .hv small{color:var(--ink-soft);font-weight:400;}
  .vbars{display:flex;align-items:flex-end;gap:4px;height:200px;padding-top:6px;}
  .vb{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;}
  .vbb{background:var(--tomato);min-height:0;}
  .vbv{font-size:10px;text-align:center;color:var(--ink-soft);white-space:nowrap;overflow:hidden;}
  .vbl{font-size:10px;text-align:center;color:var(--ink-soft);margin-top:4px;overflow:hidden;white-space:nowrap;}
  .adm-list{list-style:none;margin:0;padding:0;}
  .adm-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .adm-list li:last-child{border-bottom:none;}
  .adm-alertas{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14px;}
  .adm-alertas div{background:var(--yolk-tint);color:var(--yolk-ink);padding:8px 10px;border:1px solid var(--line);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:var(--cream);border:1px solid var(--line);padding:4px 8px;font-size:13px;}
  .sb-user{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;}
  .sb-user .u{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sb-user .p{color:var(--ink-soft);font-size:12px;}

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://celrybrlzirddysdulfz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XWDXi5AQVYEEpxprqKl6TQ_O4jThYVi";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);



  // "Dia de trabalho": o dia só vira às 5h da manhã (e não à meia-noite),
  // assim os pedidos de uma noite que passa da meia-noite continuam na mesma tela.
  let HORA_VIRADA_DIA = 5; // editável em Configurações
  try{ const h = parseInt(localStorage.getItem("hora_virada_dia"),10); if(Number.isInteger(h) && h>=0 && h<=23) HORA_VIRADA_DIA = h; }catch(e){}
  const HORA_VIRADA_ANTES = HORA_VIRADA_DIA;
  function diaTrabalho(offsetDias){ /* usa HORA_VIRADA_DIA */
    const d = new Date(Date.now() - HORA_VIRADA_DIA*3600*1000);
    if(offsetDias) d.setDate(d.getDate()-offsetDias);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function todayStr(){ return diaTrabalho(0); }
  function daysAgo(n){ return diaTrabalho(n); }
  function fmtTime(iso){
    if(!iso) return "—";
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function minutesSince(iso){
    if(!iso) return 0;
    return Math.floor((Date.now() - new Date(iso).getTime())/60000);
  }

  /* ---------- Data layer (Supabase) ---------- */
  // table "pedidos": id, data, numero, tamanho, sabor1, sabor2, quantidade,
  //   observacoes, nome, telefone, endereco, pagamento, troco, status,
  //   horario_pedido, horario_inicio_producao, horario_pronta, horario_saida, horario_entrega
  // table "clientes": id (telefone normalizado), nome, telefone, endereco, observacoes

  function rowToOrder(row){
    return {
      id: row.id, date: row.data, numero: row.numero,
      nome: row.nome, telefone: row.telefone, endereco: row.endereco, linkMaps: row.link_maps,
      pagamento: row.pagamento, troco: row.troco, valor: row.valor, status: row.status,
      pixConfirmado: !!row.pix_confirmado, fotoClienteUrl: row.foto_cliente_url||"",
      pagamentos: Array.isArray(row.pagamentos) ? row.pagamentos : null, _colPag: ("pagamentos" in row),
      entregaLat: row.entrega_lat, entregaLng: row.entrega_lng,
      itens: [], bebidas: [],
      horarios: {
        pedido: row.horario_pedido, inicioProducao: row.horario_inicio_producao,
        pronta: row.horario_pronta, saida: row.horario_saida, entrega: row.horario_entrega
      }
    };
  }
  function orderToRow(order){
    return {
      data: order.date, numero: order.numero,
      nome: order.nome, telefone: order.telefone, endereco: order.endereco, link_maps: order.linkMaps||"",
      pagamento: order.pagamento, troco: order.troco||"", valor: order.valor||0, status: order.status,
      pix_confirmado: !!order.pixConfirmado, foto_cliente_url: order.fotoClienteUrl||"",
      ...((order._colPag || (order.pagamentos && order.pagamentos.length>1)) ? { pagamentos: (order.pagamentos && order.pagamentos.length>1) ? order.pagamentos : null } : {}),
      entrega_lat: order.entregaLat != null ? order.entregaLat : null,
      entrega_lng: order.entregaLng != null ? order.entregaLng : null,
      horario_pedido: order.horarios.pedido, horario_inicio_producao: order.horarios.inicioProducao,
      horario_pronta: order.horarios.pronta, horario_saida: order.horarios.saida, horario_entrega: order.horarios.entrega
    };
  }

  function rowToPizzaItem(row){
    return { id: row.id, tamanho: row.tamanho, sabor1: row.sabor1, sabor2: row.sabor2||"",
      meioAMeio: !!row.sabor2, borda: row.borda||"", quantidade: row.quantidade||1,
      observacoes: row.observacoes||"", valor: row.valor||0 };
  }
  function pizzaItemToRow(pedidoId, item){
    return { pedido_id: pedidoId, tamanho: item.tamanho, sabor1: item.sabor1,
      sabor2: item.meioAMeio ? (item.sabor2||"") : "", borda: item.borda||"",
      quantidade: parseInt(item.quantidade)||1, observacoes: item.observacoes||"", valor: item.valor||0 };
  }
  function rowToBebidaItem(row){
    return { id: row.id, nome: row.nome, quantidade: row.quantidade||1, valor: row.valor||0 };
  }
  function bebidaItemToRow(pedidoId, item){
    return { pedido_id: pedidoId, nome: item.nome, quantidade: parseInt(item.quantidade)||1, valor: item.valor||0 };
  }

  async function attachItems(orders){
    if(!orders.length) return;
    const ids = orders.map(o=>o.id);
    const pizzaGrouped = {}, bebidaGrouped = {};
    for(let i=0; i<ids.length; i+=100){
      const lote = ids.slice(i, i+100);
      const [{data:pizzaRows, error:e1}, {data:bebidaRows, error:e2}] = await Promise.all([
        supabase.from("itens_pedido").select("*").in("pedido_id", lote),
        supabase.from("itens_bebida").select("*").in("pedido_id", lote)
      ]);
      if(e1) console.error(e1);
      if(e2) console.error(e2);
      (pizzaRows||[]).forEach(r=>{ (pizzaGrouped[r.pedido_id] = pizzaGrouped[r.pedido_id]||[]).push(rowToPizzaItem(r)); });
      (bebidaRows||[]).forEach(r=>{ (bebidaGrouped[r.pedido_id] = bebidaGrouped[r.pedido_id]||[]).push(rowToBebidaItem(r)); });
    }
    orders.forEach(o=>{ o.itens = pizzaGrouped[o.id] || []; o.bebidas = bebidaGrouped[o.id] || []; });
  }

  // O Supabase devolve no máximo 1000 linhas por consulta: busca em páginas até acabar.
  async function paginar(montar){
    const out = [];
    for(let ini=0; ; ini+=1000){
      const { data, error } = await montar(ini, ini+999);
      if(error){ console.error(error); break; }
      out.push(...(data||[]));
      if(!data || data.length < 1000) break;
    }
    return out;
  }
  let _todosCache = { t:0, rows:null };
  async function getTodosPedidos(){
    if(_todosCache.rows && Date.now()-_todosCache.t < 60000) return _todosCache.rows;
    const rows = await paginar((a,b)=> supabase.from("pedidos").select("*").order("data",{ascending:true}).order("id",{ascending:true}).range(a,b));
    _todosCache = { t:Date.now(), rows: rows.map(rowToOrder) };
    return _todosCache.rows;
  }

  function fmtMoney(v){
    const n = Number(v)||0;
    return "R$ " + n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
  }


  /* ---------- Formas de pagamento (pode dividir em mais de uma) ---------- */
  const FORMAS_PAG = ["Dinheiro","Cartão","Pix"];
  function pagamentosDe(o){
    if(Array.isArray(o.pagamentos) && o.pagamentos.length) return o.pagamentos;
    return [{ forma:o.pagamento||"", valor:Number(o.valor)||0 }];
  }
  function temPix(o){ return pagamentosDe(o).some(p=>p.forma==="Pix"); }
  function pagLabel(o){
    const l = pagamentosDe(o);
    if(l.length < 2) return o.pagamento||"";
    return l.map(p=>`${p.forma} ${fmtMoney(p.valor)}`).join(" + ");
  }
  const PagUI = {
    mount(box, getTotal, inicial, onTroco){
      let rows = [];
      const total = ()=> Number(getTotal())||0;
      const ctl = {};
      function resumo(){
        const el = box.querySelector(".pag-resumo");
        if(!el) return;
        if(rows.length < 2){ el.textContent = ""; el.classList.remove("erro"); return; }
        const soma = rows.reduce((a,r)=> a + (parseFloat(r.valor)||0), 0);
        const dif = Math.round((total()-soma)*100)/100;
        if(Math.abs(dif) < 0.01){ el.textContent = "✓ A soma confere com o total"; el.classList.remove("erro"); }
        else { el.textContent = (dif>0 ? "Falta " : "Passou ") + fmtMoney(Math.abs(dif)) + " para fechar o total de " + fmtMoney(total()); el.classList.add("erro"); }
      }
      function troco(){ if(onTroco) onTroco(rows.some(r=>r.forma==="Dinheiro")); }
      function draw(){
        const multi = rows.length > 1;
        box.innerHTML = `<div class="pag-rows">${rows.map((r,i)=>`
          <div class="pag-row" data-i="${i}">
            <select class="pag-forma"><option value="">Forma de pagamento</option>${FORMAS_PAG.map(f=>`<option ${r.forma===f?"selected":""}>${f}</option>`).join("")}</select>
            ${multi ? `<input class="pag-valor" type="number" step="0.01" min="0" placeholder="R$" value="${r.valor}"><button type="button" class="danger-text pag-rm" title="Remover">✕</button>` : ""}
          </div>`).join("")}</div>
          <div class="pag-resumo"></div>
          <button type="button" class="ghost pag-add" style="width:100%;">+ Dividir em outra forma de pagamento</button>`;
        box.querySelectorAll(".pag-row").forEach(row=>{
          const i = parseInt(row.dataset.i,10);
          row.querySelector(".pag-forma").addEventListener("change", e=>{ rows[i].forma = e.target.value; troco(); });
          const v = row.querySelector(".pag-valor");
          if(v) v.addEventListener("input", ()=>{
            rows[i].valor = v.value; rows[i].manual = true;
            if(rows.length === 2 && !rows[1-i].manual){
              const resto = Math.max(0, total() - (parseFloat(v.value)||0));
              rows[1-i].valor = resto ? resto.toFixed(2) : "";
              const outro = box.querySelectorAll(".pag-valor")[1-i];
              if(outro) outro.value = rows[1-i].valor;
            }
            resumo();
          });
          const rm = row.querySelector(".pag-rm");
          if(rm) rm.addEventListener("click", ()=>{ rows.splice(i,1); draw(); troco(); });
        });
        box.querySelector(".pag-add").addEventListener("click", ()=>{
          if(rows.length === 1) rows[0].manual = false;
          rows.push({forma:"", valor:"", manual:false});
          draw();
        });
        resumo();
      }
      ctl.set = (arr)=>{
        rows = (arr && arr.length)
          ? arr.map(p=>({ forma:p.forma||"", valor: arr.length>1 && p.valor!=null ? String(p.valor) : "", manual:true }))
          : [{forma:"", valor:"", manual:false}];
        draw(); troco();
      };
      ctl.atualizar = resumo;
      ctl.get = ()=>{
        const t = total();
        if(rows.some(r=>!r.forma)) return { erro: rows.length>1 ? "Escolha a forma de cada pagamento" : "Escolha a forma de pagamento" };
        let lista;
        if(rows.length === 1) lista = [{ forma:rows[0].forma, valor:t }];
        else {
          lista = rows.map(r=>({ forma:r.forma, valor: Math.round((parseFloat(r.valor)||0)*100)/100 }));
          if(lista.some(p=>p.valor<=0)) return { erro:"Informe o valor de cada forma de pagamento" };
          const soma = lista.reduce((a,p)=>a+p.valor,0);
          if(Math.abs(soma-t) >= 0.01) return { erro:"A soma dos pagamentos ("+fmtMoney(soma)+") precisa ser igual ao total ("+fmtMoney(t)+")" };
        }
        return { pagamentos: lista, pagamento: [...new Set(lista.map(p=>p.forma))].join(" + ") };
      };
      ctl.set(inicial);
      return ctl;
    }
  };

  async function createOrder(orderData, pizzaItems, bebidaItems){
    const date = todayStr();
    const { data: last } = await supabase.from("pedidos").select("numero")
      .eq("data", date).order("numero", {ascending:false}).limit(1);
    const numero = (last && last[0] ? last[0].numero : 0) + 1;
    const order = {
      date, numero,
      nome:orderData.nome, telefone:orderData.telefone, endereco:orderData.endereco, linkMaps:orderData.link_maps||"",
      pagamento:orderData.pagamento, pagamentos:orderData.pagamentos||null, troco:orderData.troco||"", valor:parseFloat(String(orderData.valor||"0").replace(",", "."))||0,
      status:"Pendente", pixConfirmado:false, fotoClienteUrl:orderData.fotoClienteUrl||"",
      horarios:{ pedido:new Date().toISOString(), inicioProducao:null, pronta:null, saida:null, entrega:null }
    };
    const { data: inserted, error } = await supabase.from("pedidos").insert(orderToRow(order)).select().single();
    if(error){ console.error(error); throw error; }
    const insertedOrder = rowToOrder(inserted);
    if(pizzaItems.length){
      const { error: e1 } = await supabase.from("itens_pedido").insert(pizzaItems.map(it=>pizzaItemToRow(insertedOrder.id, it)));
      if(e1) console.error(e1);
    }
    if(bebidaItems.length){
      const { error: e2 } = await supabase.from("itens_bebida").insert(bebidaItems.map(it=>bebidaItemToRow(insertedOrder.id, it)));
      if(e2) console.error(e2);
    }
    insertedOrder.itens = pizzaItems;
    insertedOrder.bebidas = bebidaItems;
    for(const item of pizzaItems){ await adjustEstoqueMassa(item.tamanho, -(parseInt(item.quantidade)||1)); }
    for(const b of bebidaItems){ await adjustEstoqueBebida(b.nome, -(parseInt(b.quantidade)||1)); }
    return insertedOrder;
  }

  /* date range helpers for Administração */
  function parseYMD(s){
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y, m-1, d);
  }
  function fmtYMD(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function weekRange(dateStr){
    const d = parseYMD(dateStr);
    const dow = d.getDay(); // 0=domingo
    const diffToMonday = dow === 0 ? -6 : 1 - dow;
    const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return [fmtYMD(monday), fmtYMD(sunday)];
  }
  function monthRange(dateStr){
    const d = parseYMD(dateStr);
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return [fmtYMD(first), fmtYMD(last)];
  }
  function fmtDateBR(s){
    const d = parseYMD(s);
    return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
  }

    if(!data) return;
    const current = data.estoque || 0;

  /* ---------- Sound ---------- */
  let _audioCtx = null;
  function audioCtx(){
    try{
      if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(_audioCtx.state === "suspended") _audioCtx.resume();
    }catch(e){}
    return _audioCtx;

  // o navegador só libera o som depois de um toque do usuário na tela
  ["pointerdown","keydown","touchstart"].forEach(ev=> document.addEventListener(ev, ()=>audioCtx(), {passive:true}));
  function tocar(vezes){
    const ctx = audioCtx();
    if(ctx){
      try{
        const t0 = ctx.currentTime + 0.02;
        for(let i=0;i<vezes;i++){
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = "sine"; o.frequency.value = 880;
          const t = t0 + i*0.36;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.35, t+0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t+0.26);
        }
      }catch(e){}
    }
    try{ if(navigator.vibrate) navigator.vibrate(vezes>1 ? [200,100,200,100,200] : 200); }catch(e){}
  }

  /* ---------- Backup (baixar os dados) ---------- */
  const Backup = {
    baixar(nome, conteudo, tipo){
      const url = URL.createObjectURL(new Blob([conteudo], { type:tipo }));
      const a = document.createElement("a");
      a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();

    },
    stamp(){ const d = new Date(), p = n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+"h"+p(d.getMinutes()); },
    async tabela(nome, grande){

      const out = { app:"Nice Pizza Delivery", gerado_em:new Date().toISOString(), tabelas:{} };
      for(const t of grandes) out.tabelas[t] = await this.tabela(t, true);
      for(const t of pequenas) out.tabelas[t] = await this.tabela(t, false);
      const resumo = Object.entries(out.tabelas).map(([k,v])=> k+": "+(v ? v.length : "—")).join(" · ");
      this.baixar("backup-nice-pizza-"+this.stamp()+".json", JSON.stringify(out, null, 1), "application/json");

    // Restaurar: lê o .json do backup e grava de volta (registros com o mesmo id são atualizados; nada é apagado).
    async lerArquivo(file){
      const j = JSON.parse(await file.text());
      if(!j || j.app !== "Nice Pizza Delivery" || !j.tabelas) throw new Error("Esse arquivo não parece um backup do Nice Pizza Delivery");
      return j;
    },
    ORDEM:["clientes","sabores","bebidas","bordas","estoque_massa","configuracoes","pedidos","itens_pedido","itens_bebida"],
    async restaurar(j, progresso){
      const rel = [];
      for(const t of this.ORDEM){
        const rows = j.tabelas[t];
        if(!Array.isArray(rows) || !rows.length){ rel.push({t, n:0, ok:true}); continue; }
        let ok = true, msg = "";
        for(let i=0; i<rows.length; i+=300){
          if(progresso) progresso(t, Math.min(i+300, rows.length), rows.length);
          const { error } = await supabase.from(t).upsert(rows.slice(i, i+300));
          if(error){ ok = false; msg = error.message; break; }
        }
        rel.push({t, n:rows.length, ok, msg});

      _todosCache = { t:0, rows:null };

      const pi = por(itens), pb = por(bebs);

  function findByNomeCI(cache, nome){

  function pizzaItemPrice(item, saboresCache, bordasCache){

      const it = findByNomeCI(cache, nome);
      if(!it) return 0;
      return item.tamanho==="G" ? (Number(it.preco_g)||0) : (Number(it.preco_m)||0);
    };
    let p = priceOf(saboresCache, item.sabor1);
    if(item.meioAMeio && item.sabor2) p = Math.max(p, priceOf(saboresCache, item.sabor2));
    const bp = item.borda ? priceOf(bordasCache, item.borda) : 0;
    return (parseInt(item.quantidade)||1) * (p+bp);
  }
  function bebidaItemPrice(item, bebidasCache){
    const found = findByNomeCI(bebidasCache, item.nome);
    const unit = found ? Number(found.preco)||0 : 0;
    return (parseInt(item.quantidade)||1) * unit;
  }

  function renderBebidaItemBlock(item, idx){

  }

  /* ================= ATENDENTE ================= */
  const Atendente = {

    async render(root){

      this.rastreamentoMap = null;

      root.innerHTML = `

                  </form>
                  <div class="tag" style="margin-top:14px;">Para ver, editar ou excluir clientes, use a aba <strong>Clientes</strong> no menu.</div>
                </div>

              </div>
            </div>
            <div class="list-col">
              <div class="panel">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                  <h2 style="margin:0;">Pedidos de hoje</h2>
                  <button type="button" class="ghost" id="toggle-view-btn">📍 Ver rastreamento</button>
                </div>
                <div id="dashboard-pedidos-view" style="margin-top:14px;">
                  <input class="search-box" id="search" placeholder="Buscar por nome ou nº da comanda...">
                  <div id="orders-list"></div>
                </div>
                <div id="dashboard-rastreamento-view" style="display:none;margin-top:14px;">
                  <button type="button" id="toggle-rastreamento-btn" class="primary" style="width:100%;">Carregando...</button>
                  <div id="rastreamento-status" class="tag" style="margin:10px 0;"></div>

        <div id="modal-holder"></div>
      `;

      // tab switching
      root.querySelectorAll(".tab-btn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          root.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
          btn.classList.add("active");
          const tab = btn.dataset.tab;
          root.querySelector("#tab-pedido").style.display = tab==="pedido" ? "block" : "none";
          root.querySelector("#tab-clientes").style.display = tab==="clientes" ? "block" : "none";
        });
      });

      root.querySelector("#toggle-view-btn").addEventListener("click", ()=>{
        const pedidosView = root.querySelector("#dashboard-pedidos-view");
        const rastreamentoView = root.querySelector("#dashboard-rastreamento-view");
        const btn = root.querySelector("#toggle-view-btn");
        const showingPedidos = pedidosView.style.display !== "none";
        if(showingPedidos){
          pedidosView.style.display = "none";
          rastreamentoView.style.display = "block";
          btn.textContent = "📋 Ver pedidos";
          this.initRastreamentoTab();
        } else {
          pedidosView.style.display = "block";
          rastreamentoView.style.display = "none";
          btn.textContent = "📍 Ver rastreamento";
          this.refresh();
        }
      });

      root.querySelector("#toggle-rastreamento-btn").addEventListener("click", async ()=>{
        const btn = root.querySelector("#toggle-rastreamento-btn");
        const novoEstado = !this.rastreamentoAtivo;
        await setRastreamentoAtivo(novoEstado);
        this.rastreamentoAtivo = novoEstado;
        this.updateRastreamentoBtn();
      });

      const totalInput = root.querySelector('[name="valor"]');
      this.pagCtl = PagUI.mount(root.querySelector("#pag-mount"), ()=> parseFloat(totalInput.value)||0, null, tem=>{
        root.querySelector("#troco-field").style.display = tem ? "block" : "none";
      });
      totalInput.addEventListener("input", ()=> this.pagCtl.atualizar());

      // Enter avança pro próximo campo em vez de enviar o formulário (agiliza digitação)
      const orderForm = root.querySelector("#order-form");
      orderForm.addEventListener("keydown", e=>{
        if(e.key !== "Enter" || e.target.tagName === "TEXTAREA") return;
        e.preventDefault();
        const focusable = Array.from(orderForm.querySelectorAll("input, select, textarea"))
          .filter(el => el.offsetParent !== null && !el.disabled);
        const idx = focusable.indexOf(e.target);
        if(idx > -1 && idx < focusable.length - 1){
          focusable[idx+1].focus();
          if(focusable[idx+1].select) focusable[idx+1].select();
        }
      });

      root.querySelector("#add-pizza-btn").addEventListener("click", ()=>{
        this.pizzaItems.push(emptyPizzaItem());
        this.renderPizzaItems();
      });
      root.querySelector("#add-bebida-btn").addEventListener("click", ()=>{
        this.bebidaItems.push(emptyBebidaItem());
        this.renderBebidaItems();
      });

      root.querySelector('[name="valor"]').addEventListener("input", ()=>{
        this.valorManualmenteEditado = true;
      });

      // autocomplete
      await this.loadClientsCache();
      await this.loadSaboresCache();
      await this.loadBebidasCache();
      await this.loadBordasCache();
      await this.loadEstoqueMassa();
      this.renderPizzaItems();
      this.renderBebidaItems();
      const searchInput = root.querySelector("#cliente-search");
      searchInput.focus();
      searchInput.addEventListener("input", ()=>{
        const q = searchInput.value.trim().toLowerCase();
        const box = root.querySelector("#cliente-suggestions");
        if(!q){ box.innerHTML=""; return; }
        const matches = this.clientsCache.filter(c=>
          c.nome.toLowerCase().includes(q) || c.telefone.includes(q)
        ).slice(0,8);
        box.innerHTML = matches.length ? `<div class="suggestions">${matches.map(c=>`
          <div class="sugg-item" data-id="${c.id}">
            <div class="sname">${c.nome}</div>
            <div class="sphone">${c.telefone} · ${c.endereco}</div>
          </div>
        `).join("")}</div>` : `<div class="suggestions"><div class="sugg-item" style="color:var(--ink-soft);">Nenhum cliente encontrado</div></div>`;
        box.querySelectorAll(".sugg-item[data-id]").forEach(item=>{
          item.addEventListener("click", ()=>{
            const client = this.clientsCache.find(c=>c.id===item.dataset.id);
            this.selectClient(client);
            box.innerHTML = "";
            searchInput.value = "";
          });
        });
      });

      // client management form
      root.querySelector("#cliente-foto-input").addEventListener("change", e=>{
        const file = e.target.files[0];
        const preview = root.querySelector("#cliente-foto-preview");
        if(file){
          preview.innerHTML = `<img src="${URL.createObjectURL(file)}" style="max-width:160px;border-radius:0;display:block;">`;
        }
      });
      root.querySelector("#client-form").addEventListener("submit", async e=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());
        const id = normalizePhone(data.telefone);
        if(id && this.clientsCache.some(c=>c.id===id)){
          toast("Já existe um cliente com esse telefone — edite na aba Clientes");
          return;
        }
        const file = root.querySelector("#cliente-foto-input").files[0];
        if(file && id){
          toast("Enviando foto...");
          const url = await uploadClientPhoto(id, file);
          if(url) data.foto_url = url;
        }
        await upsertClient(data);
        toast("Cliente cadastrado");
        e.target.reset();
        root.querySelector("#cliente-foto-preview").innerHTML = "";
        await this.loadClientsCache();
      });

      const enviarPedido = async e=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());

        const validPizzas = this.pizzaItems.filter(it => it.tamanho && it.sabor1 && it.sabor1.trim());
        if(!validPizzas.length){
          toast("Adicione pelo menos uma pizza com tamanho e sabor");
          return;
        }
        const validBebidas = this.bebidaItems.filter(it => it.nome && it.nome.trim());

        const pg = this.pagCtl.get();
        if(pg.erro){ toast(pg.erro); return; }
        data.pagamento = pg.pagamento; data.pagamentos = pg.pagamentos;

        const matchedClient = this.clientsCache.find(c => c.id === normalizePhone(data.telefone));
        data.fotoClienteUrl = matchedClient ? (matchedClient.foto_url||"") : "";
        const order = await createOrder(data, validPizzas, validBebidas);
        if(root.querySelector("#salvar-cliente").checked && data.telefone){
          await upsertClient(data);
          await this.loadClientsCache();
        }
        toast("Comanda #"+order.numero+" enviada");
        if(Imprimir.auto()) Imprimir.comanda(await getOrderByNumero(todayStr(), order.numero) || order);
        e.target.reset();
        root.querySelector("#troco-field").style.display="none";
        this.pagCtl.set(null);
        root.querySelector("#salvar-cliente").checked = true;
        this.selectedClientId = null;
        this.valorManualmenteEditado = false;
        root.querySelector("#selected-client-box").innerHTML = "";
        this.pizzaItems = [emptyPizzaItem()];
        this.bebidaItems = [];
        this.renderPizzaItems();
        this.renderBebidaItems();
        this.recalcValor();
        this.refresh();
        await this.loadEstoqueMassa();
        await this.loadBebidasCache();
        searchInput.focus();
      };
      root.querySelector("#order-form").addEventListener("submit", async e=>{
        e.preventDefault();
        if(this._enviando) return; // evita pedido duplicado por toque duplo
        this._enviando = true;
        const btn = e.target.querySelector('button[type="submit"]'); if(btn) btn.disabled = true;
        try{ await enviarPedido(e); } finally { this._enviando = false; if(btn) btn.disabled = false; }
      });
      root.querySelector("#search").addEventListener("input", ()=> this.refresh());
      await this.refresh();
    },
    async loadClientsCache(){
      this.clientsCache = await getClients();
    },
    async loadSaboresCache(){
      this.saboresCache = await getItems("sabores");
      const list = this.root.querySelector("#sabores-datalist");
      if(list) list.innerHTML = this.saboresCache.map(s=>`<option value="${s.nome}">`).join("");
      this.recalcValor();
    },
    async loadBebidasCache(){
      this.bebidasCache = await getItems("bebidas");
      const list = this.root.querySelector("#bebidas-datalist");
      const emEstoque = this.bebidasCache.filter(b => (b.estoque||0) > 0);
      if(list) list.innerHTML = emEstoque.map(b=>`<option value="${b.nome}">`).join("");
      this.recalcValor();
    },
    async loadBordasCache(){
      this.bordasCache = await getItems("bordas");
      const list = this.root.querySelector("#bordas-datalist");
      if(list) list.innerHTML = this.bordasCache.map(b=>`<option value="${b.nome}">`).join("");
      this.recalcValor();
    },
    async loadEstoqueMassa(){
      this.estoqueMassa = await getEstoqueMassa();
      const el = this.root.querySelector("#massa-info");
      if(el) el.textContent = `🍞 Massa disponível hoje — M: ${this.estoqueMassa.M} · G: ${this.estoqueMassa.G}`;
    },
    async initRastreamentoTab(){
      this.rastreamentoAtivo = await getRastreamentoAtivo();
      this.updateRastreamentoBtn();
      if(!this.rastreamentoMap){
        this.rastreamentoMap = new maplibregl.Map({
          container: "rastreamento-map",
          style: "https://tiles.openfreemap.org/styles/liberty",
          center: [-52.2064, -3.2033],
          zoom: 12
        });
        this.rastreamentoMap.addControl(new maplibregl.NavigationControl());
      }
      setTimeout(()=> this.rastreamentoMap.resize(), 50);
      await this.updateRastreamentoMarker();
    },
    updateRastreamentoBtn(){
      const btn = this.root.querySelector("#toggle-rastreamento-btn");
      if(!btn) return;
      if(this.rastreamentoAtivo){
        btn.textContent = "Desativar rastreamento";
        btn.classList.remove("primary"); btn.classList.add("danger-btn");
      } else {
        btn.textContent = "Ativar rastreamento";
        btn.classList.remove("danger-btn"); btn.classList.add("primary");
      }
    },
    async updateRastreamentoMarker(){
      const loc = await getLocalizacaoEntregador();
      const statusEl = this.root.querySelector("#rastreamento-status");
      if(!loc || !loc.lat || !loc.lng){
        if(statusEl) statusEl.textContent = "Ainda sem localização recebida do entregador.";
        return;
      }
      const pos = [loc.lng, loc.lat];
      if(this.rastreamentoMarker){
        this.rastreamentoMarker.setLngLat(pos);
      } else if(this.rastreamentoMap) {
        const el = document.createElement("div");
        el.style.fontSize = "28px";
        el.style.lineHeight = "1";
        el.style.filter = "drop-shadow(0 2px 3px rgba(0,0,0,.4))";
        el.textContent = "🛵";
        this.rastreamentoMarker = new maplibregl.Marker({element: el, anchor: "center"}).setLngLat(pos).addTo(this.rastreamentoMap);
      }
      if(this.rastreamentoMap) this.rastreamentoMap.flyTo({ center: pos, zoom: Math.max(this.rastreamentoMap.getZoom(), 15) });
      if(statusEl){
        const segs = Math.floor((Date.now() - new Date(loc.updated_at).getTime())/1000);
        const txt = segs < 60 ? `atualizado há ${segs}s` : `atualizado há ${Math.floor(segs/60)} min`;
        statusEl.textContent = `📍 ${txt}` + (segs > 120 ? " — pode estar desatualizado" : "");
      }
    },
    renderPizzaItems(){
      const container = this.root.querySelector("#pizza-items-list");
      container.innerHTML = this.pizzaItems.map((it,i)=>renderPizzaItemBlock(it,i,this.pizzaItems.length>1)).join("");
      container.querySelectorAll(".remove-pizza-btn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          this.pizzaItems.splice(parseInt(btn.dataset.idx,10),1);
          this.renderPizzaItems();
          this.recalcValor();
        });
      });
      container.querySelectorAll(".pz-tamanho, .pz-quantidade, .pz-sabor1, .pz-sabor2, .pz-borda").forEach(el=>{
        el.addEventListener("input", ()=> this.updatePizzaItemField(el));
        el.addEventListener("change", ()=> this.updatePizzaItemField(el));
      });
      container.querySelectorAll(".pz-obs").forEach(el=>{
        el.addEventListener("input", ()=>{ this.pizzaItems[parseInt(el.dataset.idx,10)].observacoes = el.value; });
      });
      container.querySelectorAll(".pz-meio").forEach(el=>{
        el.addEventListener("change", ()=>{
          const idx = parseInt(el.dataset.idx,10);
          this.pizzaItems[idx].meioAMeio = el.checked;
          container.querySelector(`.pz-sabor2-field[data-idx="${idx}"]`).style.display = el.checked ? "block" : "none";
          this.recalcValor();
        });
      });
    },
    updatePizzaItemField(el){
      const idx = parseInt(el.dataset.idx,10);
      const item = this.pizzaItems[idx];
      if(el.classList.contains("pz-tamanho")) item.tamanho = el.value;
      else if(el.classList.contains("pz-quantidade")) item.quantidade = parseInt(el.value)||1;
      else if(el.classList.contains("pz-sabor1")) item.sabor1 = el.value;
      else if(el.classList.contains("pz-sabor2")) item.sabor2 = el.value;
      else if(el.classList.contains("pz-borda")) item.borda = el.value;
      this.recalcValor();
    },
    renderBebidaItems(){
      const container = this.root.querySelector("#bebida-items-list");
      container.innerHTML = this.bebidaItems.map((it,i)=>renderBebidaItemBlock(it,i)).join("");
      container.querySelectorAll(".remove-bebida-btn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          this.bebidaItems.splice(parseInt(btn.dataset.idx,10),1);
          this.renderBebidaItems();
          this.recalcValor();
        });
      });
      container.querySelectorAll(".bb-nome, .bb-quantidade").forEach(el=>{
        el.addEventListener("input", ()=>{
          const idx = parseInt(el.dataset.idx,10);
          const item = this.bebidaItems[idx];
          if(el.classList.contains("bb-nome")) item.nome = el.value;
          else item.quantidade = parseInt(el.value)||1;
          this.recalcValor();
        });
      });
    },
    recalcValor(){
      const form = this.root.querySelector("#order-form");
      if(!form) return;
      let total = 0;
      this.pizzaItems.forEach((it,i)=>{
        it.valor = pizzaItemPrice(it, this.saboresCache, this.bordasCache);
        total += it.valor;
        const span = this.root.querySelector(`.item-block[data-idx="${i}"] .pz-subtotal`);
        if(span) span.textContent = fmtMoney(it.valor);
      });
      this.bebidaItems.forEach((it,i)=>{
        it.valor = bebidaItemPrice(it, this.bebidasCache);
        total += it.valor;
        const blocks = this.root.querySelectorAll("#bebida-items-list .item-block");
        if(blocks[i]){ const span = blocks[i].querySelector(".bb-subtotal"); if(span) span.textContent = fmtMoney(it.valor); }
      });
      if(!this.valorManualmenteEditado){
        form.querySelector('[name="valor"]').value = total.toFixed(2);
        if(this.pagCtl) this.pagCtl.atualizar();
      }
    },
    selectClient(client){
      this.selectedClientId = client.id;
      const form = this.root.querySelector("#order-form");
      form.querySelector('[name="nome"]').value = client.nome;
      form.querySelector('[name="telefone"]').value = client.telefone;
      form.querySelector('[name="endereco"]').value = client.endereco;
      form.querySelector('[name="link_maps"]').value = client.link_maps || "";
      this.root.querySelector("#selected-client-box").innerHTML = `
        <div class="selected-client">
          <span>Cliente: ${client.nome}</span>
          <button type="button" id="clear-client-btn">trocar</button>
        </div>
      `;
      this.root.querySelector("#clear-client-btn").addEventListener("click", ()=>{
        this.selectedClientId = null;
        form.querySelector('[name="nome"]').value = "";
        form.querySelector('[name="telefone"]').value = "";
        form.querySelector('[name="endereco"]').value = "";
        form.querySelector('[name="link_maps"]').value = "";
        this.root.querySelector("#selected-client-box").innerHTML = "";
      });

    async refresh(){
      const orders = await getOrdersForDate(todayStr());
      const q = (this.root.querySelector("#search")?.value || "").trim().toLowerCase();
      const filtered = q ? orders.filter(o =>
        o.nome.toLowerCase().includes(q) || String(o.numero).includes(q)
      ) : orders;
      const listEl = this.root.querySelector("#orders-list");
      if(!filtered.length){
        setHtml(listEl, '<div class="empty">Nenhum pedido ainda hoje.</div>');

      const rows = filtered.slice().reverse().map(o => `
        <tr data-numero="${o.numero}">
          <td class="num">#${o.numero}</td>
          <td>${fmtTime(o.horarios.pedido)}</td>
          <td>${orderPizzasSummary(o)}${o.bebidas && o.bebidas.length ? `<br><span style="color:var(--ink-soft)">🥤 ${orderBebidasSummary(o)}</span>` : ""}</td>
          <td>${o.nome}<br><span style="color:var(--ink-soft);font-size:12px;">💳 ${pagLabel(o)}</span></td>
          <td><span class="status-pill ${statusClass(o.status)}">${o.status}</span></td>
          <td>${temPix(o) ? (
            o.pixConfirmado

          ) : ""}</td>
          <td><button class="ghost" data-print="${o.numero}" title="Imprimir comanda" style="padding:6px 10px;font-size:13px;">🖨</button>${o.status==="Pendente" ? `
            <button class="ghost edit-btn" data-numero="${o.numero}" style="padding:6px 10px;font-size:13px;">Editar</button>
            <button class="danger-text cancel-btn" data-numero="${o.numero}">Cancelar</button>
          ` : ""}</td>
        </tr>
      `).join("");
      setHtml(listEl, `
        <table class="orders">
          <thead><tr><th>Nº</th><th>Hora</th><th>Pedido</th><th>Cliente</th><th>Status</th><th>Pix</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `);
      listEl.querySelectorAll(".confirm-pix-btn").forEach(btn=>{
        bindOnce(btn, "click", async ()=>{
          const numero = parseInt(btn.dataset.numero,10);
          const order = await getOrderByNumero(todayStr(), numero);
          order.pixConfirmado = true;
          await saveOrder(order);
          toast("Pix da comanda #"+numero+" confirmado — liberada pro entregador");
          this.refresh();
        });
      });
      listEl.querySelectorAll(".cancel-btn").forEach(btn=>{
        bindOnce(btn, "click", async ()=>{
          const numero = parseInt(btn.dataset.numero,10);
          if(confirm("Tem certeza que quer cancelar a comanda #"+numero+"?")){
            const order = await getOrderByNumero(todayStr(), numero);
            order.status = "Cancelada";
            await saveOrder(order);
            await restockOrder(order);
            toast("Comanda #"+numero+" cancelada");
            this.refresh();
            await this.loadEstoqueMassa();
            await this.loadBebidasCache();
          }
        });
      });
      listEl.querySelectorAll(".edit-btn").forEach(btn=>{
        bindOnce(btn, "click", async ()=>{
          const numero = parseInt(btn.dataset.numero,10);
          const order = await getOrderByNumero(todayStr(), numero);
          this.openEditModal(order);
        });

    openEditModal(order){
      const holder = this.root.querySelector("#modal-holder");
      holder.innerHTML = `
        <div class="modal-backdrop" id="modal-bg">
          <div class="modal">
            <h3>Editar comanda #${order.numero}</h3>
            <p style="font-size:13px;color:var(--ink-soft);margin-top:-8px;">Pizzas e bebidas não podem ser editadas aqui — se precisar mudar, cancele e lance de novo. Dá pra ajustar os dados do cliente e pagamento.</p>
            <form id="edit-form">
              <div class="field"><label>Nome</label><input name="nome" value="${order.nome}"></div>
              <div class="field"><label>Telefone</label><input name="telefone" value="${order.telefone}"></div>
              <div class="field"><label>Endereço</label><textarea name="endereco" rows="2">${order.endereco}</textarea></div>
              <div class="field"><label>Link do Google Maps (opcional)</label><input name="linkMaps" value="${order.linkMaps||""}" placeholder="https://maps.app.goo.gl/..."></div>
              <div class="field"><label>Valor total do pedido (R$)</label><input name="valor" type="number" step="0.01" min="0" value="${order.valor||0}"></div>
              <div class="field"><label>Pagamento</label><div id="edit-pag-mount"></div></div>
              <div class="field" id="edit-troco-field"><label>Troco para quanto?</label><input name="troco" value="${order.troco||""}"></div>
              <div class="actions">
                <button type="submit" class="primary">Salvar</button>
                <button type="button" class="ghost" id="cancel-edit">Fechar</button>
              </div>
            </form>
          </div>
        </div>
      `;
      const valorInp = holder.querySelector('[name="valor"]');
      const pagCtl = PagUI.mount(holder.querySelector("#edit-pag-mount"), ()=> parseFloat(valorInp.value)||0, pagamentosDe(order), tem=>{
        holder.querySelector("#edit-troco-field").style.display = tem ? "block" : "none";
      });
      valorInp.addEventListener("input", ()=> pagCtl.atualizar());
      holder.querySelector("#cancel-edit").addEventListener("click", ()=> holder.innerHTML="");
      holder.querySelector("#modal-bg").addEventListener("click", e=>{ if(e.target.id==="modal-bg") holder.innerHTML=""; });
      holder.querySelector("#edit-form").addEventListener("submit", async e=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());
        data.valor = parseFloat(data.valor)||0;
        const pg = pagCtl.get();
        if(pg.erro){ toast(pg.erro); return; }
        Object.assign(order, data);
        order.pagamento = pg.pagamento; order.pagamentos = pg.pagamentos;
        await saveOrder(order);
        holder.innerHTML = "";
        toast("Comanda #"+order.numero+" atualizada");
        this.refresh();
      });
    }
  };

  /* ================= ENTREGADOR ================= */
  const Entregador = {
    root:null, tickTimer:null, bebidaConfirmada:new Set(), fotosAbertas:new Set(), trackingInterval:null, locked:false,
    async render(root, locked){
      this.root = root;
      this.locked = !!locked;
      this.bebidaConfirmada = new Set();
      this.fotosAbertas = new Set();
      this.detalhesAbertos = new Set();
      this.knownProntas = new Set();
      this.primeiraCarga = true;
      root.innerHTML = `
        <header class="topbar">
          <div><h1>🛵 Entregador</h1><div class="tag">Rota de entregas</div></div>
          <button type="button" class="ghost" data-som-btn>🔔 Som</button>
          ${this.locked ? ((Auth.ativo && Auth.user) ? '<a class="home-link" href="#" data-sair>sair</a>' : "") : '<a class="home-link" href="#/">trocar tela</a>'}
        </header>
        <main>
          <div id="device-confirm-banner" class="panel" style="display:none;margin-bottom:14px;">
            <p style="margin:0 0 10px;font-weight:600;">Este é o celular do entregador?</p>
            <p style="margin:0 0 12px;font-size:13px;color:var(--ink-soft);">Confirme só se este aparelho vai ficar com o entregador na rua — é ele que vai enviar a localização pra atendente.</p>
            <div class="row">
              <button type="button" class="primary" id="device-confirm-yes" style="flex:1;">Sim, sou o entregador</button>
              <button type="button" class="ghost" id="device-confirm-no">Não</button>
            </div>
          </div>
          <div id="tracking-status" class="tag" style="margin-bottom:14px;"></div>
          <div class="deliv-section">
            <h2>Prontas para sair</h2>
            <div id="col-prontas"></div>
          </div>
          <div class="deliv-section">
            <h2>Em rota</h2>
            <div id="col-rota"></div>
          </div>
          <div class="deliv-section">
            <h2>Entregues hoje</h2>
            <div id="col-historico"></div>
          </div>
        </main>
      `;
      await this.refresh();
      clearInterval(this.tickTimer);
      this.tickTimer = setInterval(()=> this.tick(), 1000);

      const jaConfirmado = localStorage.getItem("entregador_device_confirmado") === "1";
      if(jaConfirmado){
        await this.onTrackingConfigChange();
      } else {
        root.querySelector("#device-confirm-banner").style.display = "block";
        root.querySelector("#device-confirm-yes").addEventListener("click", async ()=>{
          localStorage.setItem("entregador_device_confirmado", "1");
          root.querySelector("#device-confirm-banner").style.display = "none";
          await this.onTrackingConfigChange();
        });
        root.querySelector("#device-confirm-no").addEventListener("click", ()=>{
          root.querySelector("#device-confirm-banner").style.display = "none";
        });
      }
    },
    async onTrackingConfigChange(){
      if(localStorage.getItem("entregador_device_confirmado") !== "1") return;
      const ativo = await getRastreamentoAtivo();
      const statusEl = this.root.querySelector("#tracking-status");
      if(ativo){
        if(statusEl) statusEl.textContent = "📍 Compartilhando localização com a atendente";
        this.startTracking();
      } else {
        if(statusEl) statusEl.textContent = "";
        this.stopTracking();
      }
    },
    startTracking(){
      if(this.trackingInterval) return;
      const statusEl = ()=> this.root ? this.root.querySelector("#tracking-status") : null;
      if(!window.isSecureContext){
        const el = statusEl();
        if(el) el.textContent = "⚠️ Rastreamento precisa que o app esteja publicado com link https:// (não funciona abrindo o arquivo direto)";
        return;
      }
      if(!navigator.geolocation){
        const el = statusEl();
        if(el) el.textContent = "⚠️ Esse navegador não suporta localização.";
        return;
      }
      const sendLocation = ()=>{
        navigator.geolocation.getCurrentPosition(
          pos => {
            upsertLocalizacaoEntregador(pos.coords.latitude, pos.coords.longitude);
            const el = statusEl();
            if(el) el.textContent = "📍 Compartilhando localização com a atendente";
          },
          err => {
            console.error("geolocation error", err);
            const el = statusEl();
            if(el) el.textContent = err.code === 1
              ? "⚠️ Permissão de localização negada — ative nas configurações do navegador"
              : "⚠️ Não foi possível obter a localização agora";
          },
          { enableHighAccuracy:true, maximumAge:3000, timeout:8000 }
        );
      };
      sendLocation();
      this.trackingInterval = setInterval(sendLocation, 5000);
    },
    stopTracking(){
      if(this.trackingInterval){ clearInterval(this.trackingInterval); this.trackingInterval = null; }
    },
    tick(){
      if(!this.root) return;
      this.root.querySelectorAll(".stopwatch").forEach(el=>{
        const start = el.dataset.start;
        if(!start) return;
        const secs = Math.max(0, Math.floor((Date.now() - new Date(start).getTime())/1000));
        const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
        el.textContent = h>0
          ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
          : `${m}:${String(s).padStart(2,"0")}`;
        const card = el.closest(".deliv-card");
        if(card) card.classList.toggle("late", secs > 15*60);
      });

          </div>
          <a class="addr" href="${mapsUrl(o)}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:var(--ink);">${o.endereco} ↗</a>
          <div class="meta">${o.telefone}${o.bebidas && o.bebidas.length ? " · 🥤 "+orderBebidasSummary(o) : ""}</div>
          <span class="pay">${fmtMoney(o.valor)} · ${pagLabel(o)}${o.troco?" · troco p/ "+o.troco:""}</span>
          <div class="footer">${o.nome}</div>
          ${o.fotoClienteUrl ? `<div class="foto-box" data-numero="${o.numero}" style="display:${this.fotosAbertas.has(o.numero)?'block':'none'};"><img src="${o.fotoClienteUrl}" class="casa-thumb" alt="Foto da casa"></div>` : ""}

  /* ================= ADMINISTRACAO ================= */
  function fmtDuration(startIso, endIso){
    if(!startIso || !endIso) return "—";
    const mins = Math.round((new Date(endIso) - new Date(startIso))/60000);
    if(mins < 0) return "—";
    if(mins < 60) return mins+" min";
    const h = Math.floor(mins/60), m = mins%60;
    return h+"h "+String(m).padStart(2,"0")+"min";
  }
  function avgDuration(orders, fromKey, toKey){
    const diffs = orders
      .map(o => [o.horarios[fromKey], o.horarios[toKey]])
      .filter(([a,b]) => a && b)
      .map(([a,b]) => (new Date(b)-new Date(a))/60000);
    if(!diffs.length) return null;
    const avg = diffs.reduce((s,v)=>s+v,0)/diffs.length;
    return Math.round(avg);
  }
  function fmtMinutes(mins){
    if(mins === null || mins === undefined) return "—";
    if(mins < 60) return mins+" min";
    const h = Math.floor(mins/60), m = Math.round(mins%60);
    return h+"h "+String(m).padStart(2,"0")+"min";
  }

  const minEntre = (a, b)=> (new Date(b)-new Date(a))/60000;
  // Erro de gestão: pedido parado mais de 2h na produção ou na entrega (mesmo que depois tenha sido entregue e pago).
  function erroGestao(o){
    if(o.status === "Cancelada") return null;
    const h = o.horarios || {}, agora = new Date().toISOString();
    if(h.pedido){
      const fim = h.pronta || (o.status === "Pendente" ? agora : null);
      if(fim){ const m = minEntre(h.pedido, fim); if(m > LIMITE_ERRO_MIN) return { etapa:"Produção", detalhe:"na cozinha", min:m, aberto:!h.pronta }; }
    }
    if(h.pronta){
      const fim = h.saida || (o.status === "Pronta" ? agora : null);
      if(fim){ const m = minEntre(h.pronta, fim); if(m > LIMITE_ERRO_MIN) return { etapa:"Entrega", detalhe:"pronta, esperando sair", min:m, aberto:!h.saida }; }
    }
    if(h.saida){
      const fim = h.entrega || (o.status === "Saiu para entrega" ? agora : null);
      if(fim){ const m = minEntre(h.saida, fim); if(m > LIMITE_ERRO_MIN) return { etapa:"Entrega", detalhe:"em rota", min:m, aberto:!h.entrega }; }
    }
    return null;
  }
  const DIAS_SEMANA = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  function addDias(str, n){ const d = parseYMD(str); d.setDate(d.getDate()+n); return fmtYMD(d); }
  function diasEntre(a, b){ return Math.max(0, Math.round((parseYMD(b)-parseYMD(a))/86400000)); }
  function fmtDataLonga(s){ const d = parseYMD(s); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
  const fmtNum = n => (Math.round((Number(n)||0)*10)/10).toLocaleString("pt-BR");
  const fmtPct = v => (v===null||v===undefined) ? "—" : (Math.round(v*10)/10).toLocaleString("pt-BR")+"%";
  function delta(cur, prev, inverso){
    if(prev === null || prev === undefined) return "";
    if(!prev && !cur) return `<span class="dl">—</span>`;
    if(!prev) return `<span class="dl dl-up">novo</span>`;
    const pct = (cur-prev)/Math.abs(prev)*100;
    if(Math.abs(pct) < 0.5) return `<span class="dl">＝ igual</span>`;
    const sobe = pct > 0, bom = inverso ? !sobe : sobe;
    return `<span class="dl ${bom?"dl-up":"dl-down"}">${sobe?"▲":"▼"} ${Math.abs(Math.round(pct))}%</span>`;
  }
  function aggPedidos(orders){
    const validos = orders.filter(o=>o.status!=="Cancelada");
    const entregues = orders.filter(o=>o.status==="Entregue");
    const erros = orders.map(o=>({ o, e:erroGestao(o) })).filter(x=>x.e);
    const entreguesOk = entregues.filter(o=>!erroGestao(o)); // só estes entram nas médias de tempo
    let pizzas = 0, bebidas = 0;
    validos.forEach(o=>{
      (o.itens||[]).forEach(it=> pizzas += parseInt(it.quantidade)||1);
      (o.bebidas||[]).forEach(b=> bebidas += parseInt(b.quantidade)||1);
    });
    const fat = validos.reduce((a,o)=> a+(Number(o.valor)||0), 0);
    const tempos = entreguesOk
      .map(o=> (o.horarios.pedido && o.horarios.entrega) ? (new Date(o.horarios.entrega)-new Date(o.horarios.pedido))/60000 : null)
      .filter(v=> v!==null && v>=0);
    return {
      total:orders.length, validos:validos.length, cancelados:orders.length-validos.length, fat,
      ticket: validos.length ? fat/validos.length : 0, pizzas, bebidas,
      pizzasPorPedido: validos.length ? pizzas/validos.length : 0,
      entregues, entreguesOk, erros,
      avgProd: avgDuration(entreguesOk,"pedido","pronta"), avgEspera: avgDuration(entreguesOk,"pronta","saida"),
      avgEntrega: avgDuration(entreguesOk,"saida","entrega"), avgTotal: avgDuration(entreguesOk,"pedido","entrega"),
      noPrazo: tempos.length ? tempos.filter(v=>v<=META_ENTREGA_MIN).length/tempos.length*100 : null
    };
  }
  function somaPorChave(lista, fnChave, fnValor){
    const m = {};
    lista.forEach(x=>{ const k = fnChave(x); if(k===null||k===undefined||k==="") return; m[k] = (m[k]||0) + fnValor(x); });

  }
  function contaSabores(validos){

    validos.forEach(o=>(o.itens||[]).forEach(it=>{

      if(it.meioAMeio && it.sabor2){
        m[it.sabor1] = (m[it.sabor1]||0) + q*0.5;
